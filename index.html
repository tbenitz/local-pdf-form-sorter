let pdfjsLib = null;
let pdfSource = "local";

function fontBase() {
  if (pdfSource === "cdn") return "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/standard_fonts/";
  return new URL("vendor/pdfjs/standard_fonts/", document.baseURI).href;
}

async function loadPdfJs() {
  if (pdfjsLib) return pdfjsLib;
  const pairs = [
    [new URL("vendor/pdfjs/pdf.min.mjs", document.baseURI).href, new URL("vendor/pdfjs/pdf.worker.min.mjs", document.baseURI).href, "local"],
    ["https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs", "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs", "cdn"],
  ];
  let last;
  for (const [src, worker, kind] of pairs) {
    try {
      const lib = await import(src);
      lib.GlobalWorkerOptions.workerSrc = worker;
      pdfjsLib = lib;
      pdfSource = kind;
      return lib;
    } catch (err) {
      last = err;
    }
  }
  throw last || new Error("pdf.js failed to load");
}

function classifyError(err) {
  const name = err?.name || "";
  const msg = String(err?.message || err);
  if (name === "PasswordException" || /password/i.test(msg)) return "Password protected";
  if (/not a pdf/i.test(msg)) return "Not a PDF";
  if (name === "InvalidPDFException" || /invalid pdf/i.test(msg)) return "Corrupt or not a PDF";
  return msg.slice(0, 180);
}

function textOf(content) {
  let out = "";
  let lastY = null;
  for (const item of content.items || []) {
    if (!item.str) continue;
    const y = item.transform ? item.transform[5] : null;
    if (lastY != null && y != null && Math.abs(y - lastY) > 2) out += "\n";
    else if (out && !out.endsWith("\n") && !out.endsWith(" ")) out += " ";
    out += item.str;
    lastY = y;
  }
  return out;
}

async function readCheap(file) {
  const src = state.sources.get(file.id);
  if (!src?.file) throw new Error("File bytes are not loaded. Reopen the folder.");
  const buf = await src.file.arrayBuffer();
  const head = new TextDecoder("latin1").decode(new Uint8Array(buf.slice(0, 16)));
  if (!head.includes("%PDF-")) throw new Error("Not a PDF");
  file.pdfVersion = (head.match(/%PDF-(\d+\.\d+)/) || [])[1] || "";
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), standardFontDataUrl: fontBase(), disableAutoFetch: true }).promise;
  try {
    file.pageCount = pdf.numPages;
    const meta = await pdf.getMetadata().catch(() => null);
    file.producer = String(meta?.info?.Producer || "");
    file.creator = String(meta?.info?.Creator || "");
    const limit = Math.min(pdf.numPages, 6);
    const pageTexts = [];
    const sizes = [];
    for (let i = 1; i <= limit; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 1 });
      if (i <= 3) sizes.push({ w: Math.round(vp.width), h: Math.round(vp.height) });
      pageTexts.push(textOf(await page.getTextContent()));
      page.cleanup();
    }
    file.pageSizes = sizes;
    const box = sizes[0] || { w: 612, h: 792 };
    file.sizeBucket = sizeBucket(box.w, box.h);
    file.aspect = Math.round((box.w / box.h) * 1000) / 1000;
    const names = [];
    const values = {};
    const types = {};
    let fieldMap = null;
    try { fieldMap = await pdf.getFieldObjects(); } catch { fieldMap = null; }
    if (fieldMap) {
      for (const [name, arr] of Object.entries(fieldMap)) {
        if (!name) continue;
        const item = (arr && arr[0]) || {};
        names.push(name);
        types[name] = item.type || "";
        if (item.value != null && String(item.value).trim()) values[name] = String(item.value).trim();
      }
    }
    if (!names.length) {
      for (let i = 1; i <= Math.min(4, pdf.numPages); i++) {
        const page = await pdf.getPage(i);
        const annots = await page.getAnnotations();
        for (const annot of annots) {
          if (!annot.fieldName) continue;
          names.push(annot.fieldName);
          types[annot.fieldName] = annot.fieldType || "";
          if (annot.fieldValue) values[annot.fieldName] = String(annot.fieldValue);
        }
        page.cleanup();
      }
    }
    file.fieldNames = [...new Set(names)].sort();
    file.fieldTypes = types;
    file.fieldValues = values;
    file.fieldSig = file.fieldNames.join("|");
    const norms = pageTexts.map((t) => normalizeText(t, state.settings));
    let best = 0;
    for (let i = 1; i < norms.length; i++) if (norms[i].tokens.length > norms[best].tokens.length) best = i;
    file.dominantPage = best + 1;
    file.packet = false;
    if (norms.length >= 2 && best !== 0) {
      const jac = jaccardSets(norms[0].tokens, norms[best].tokens);
      if ((norms[0].realChars < 50 && norms[best].realChars >= 40) || (norms[best].tokens.length >= 8 && jac < 0.35)) file.packet = true;
    }
    const ident = norms[best] || { tokens: [], revision: "", realChars: 0 };
    file.tokens = ident.tokens;
    file.revision = norms.map((n) => n.revision).find(Boolean) || "";
    file.realChars = Math.max(0, ...norms.map((n) => n.realChars));
    file.rawText = (pageTexts[best] || "").slice(0, 2500);
    file.snippet = (pageTexts[best] || "").replace(/\s+/g, " ").trim().slice(0, 160);
    file.junkLikely = looksJunk(file);
    file.capture = file.fieldNames.length >= 2 ? "fillable" : file.realChars >= state.settings.ocrTriggerChars ? "digital" : "scan";
    file.outOfRange = file.pageCount < state.settings.minPages || file.pageCount > state.settings.maxPages;
    file.didRead = true;
  } finally {
    await pdf.destroy().catch(() => {});
  }
}

function downscale(canvas, width) {
  const scale = Math.min(1, width / canvas.width);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(canvas.width * scale));
  c.height = Math.max(1, Math.round(canvas.height * scale));
  c.getContext("2d").drawImage(canvas, 0, 0, c.width, c.height);
  return c;
}

function rotateCanvas(canvas, deg) {
  if (!deg) return canvas;
  const c = document.createElement("canvas");
  c.width = canvas.width;
  c.height = canvas.height;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate((deg * Math.PI) / 180);
  ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  return c;
}

function rowVariance(canvas) {
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let mean = 0;
  const rows = new Float32Array(height);
  for (let y = 0; y < height; y++) {
    let s = 0;
    for (let x = 0; x < width; x += 3) {
      const i = (y * width + x) * 4;
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      if (lum < 176) s += 176 - lum;
    }
    rows[y] = s;
    mean += s;
  }
  mean /= height || 1;
  let v = 0;
  for (let y = 0; y < height; y++) {
    const d = rows[y] - mean;
    v += d * d;
  }
  return v;
}

function deskew(canvas, maxDeg) {
  const max = Math.max(0, Math.min(8, maxDeg | 0));
  if (!max) return canvas;
  const small = downscale(canvas, 220);
  let bestA = 0;
  let bestV = -1;
  for (let a = -max; a <= max; a++) {
    const v = rowVariance(rotateCanvas(small, a));
    if (v > bestV) { bestV = v; bestA = a; }
  }
  return bestA ? rotateCanvas(canvas, bestA) : canvas;
}

function cropMargins(canvas) {
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const { data, width, height } = image;
  let minX = width, minY = height, maxX = 0, maxY = 0;
  for (let y = 0; y < height; y += 2) {
    for (let x = 0; x < width; x += 2) {
      const i = (y * width + x) * 4;
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      if (lum < 185) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX <= minX + 8 || maxY <= minY + 8) return canvas;
  const pad = 4;
  minX = Math.max(0, minX - pad);
  minY = Math.max(0, minY - pad);
  maxX = Math.min(width - 1, maxX + pad);
  maxY = Math.min(height - 1, maxY + pad);
  const c = document.createElement("canvas");
  c.width = maxX - minX + 1;
  c.height = maxY - minY + 1;
  c.getContext("2d").drawImage(canvas, minX, minY, c.width, c.height, 0, 0, c.width, c.height);
  return c;
}

function dHash(canvas) {
  const c = document.createElement("canvas");
  c.width = 9;
  c.height = 8;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, 9, 8);
  ctx.drawImage(canvas, 0, 0, 9, 8);
  const d = ctx.getImageData(0, 0, 9, 8).data;
  let bits = "";
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      const i = (y * 9 + x) * 4;
      const j = i + 4;
      const a = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const b = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
      bits += a < b ? "1" : "0";
    }
  }
  return bits;
}

function projections(canvas) {
  const bins = 32;
  const small = downscale(canvas, 180);
  const ctx = small.getContext("2d", { willReadFrequently: true });
  const { data, width, height } = ctx.getImageData(0, 0, small.width, small.height);
  const v = Array(bins).fill(0);
  const h = Array(bins).fill(0);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = (y * width + x) * 4;
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      const ink = lum < 176 ? (176 - lum) / 176 : 0;
      if (!ink) continue;
      v[Math.min(bins - 1, (x / width) * bins | 0)] += ink;
      h[Math.min(bins - 1, (y / height) * bins | 0)] += ink;
    }
  }
  const norm = (arr) => {
    const max = Math.max(...arr, 1e-6);
    return arr.map((n) => Math.round((n / max) * 1000) / 1000);
  };
  const vn = norm(v);
  return { v: vn, h: norm(h), ink: vn.reduce((s, n) => s + n, 0) / bins };
}

function makeThumb(canvas) {
  const c = document.createElement("canvas");
  c.width = 200;
  c.height = Math.max(1, Math.round(canvas.height * (200 / canvas.width)));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.62);
}

async function fingerprintPage(pdf, pageNo, settings) {
  const page = await pdf.getPage(pageNo);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min((settings.dpi || 72) / 72, 640 / base.width);
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(vp.width));
  canvas.height = Math.max(1, Math.floor(vp.height));
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  page.cleanup();
  const fixed = cropMargins(deskew(canvas, settings.skewDeg));
  const proj = projections(fixed);
  const band = Math.max(24, Math.round(fixed.height * (settings.headerBand || 0.22)));
  const header = document.createElement("canvas");
  header.width = fixed.width;
  header.height = band;
  header.getContext("2d").drawImage(fixed, 0, 0, fixed.width, band, 0, 0, fixed.width, band);
  return { dHash: dHash(fixed), projV: proj.v, projH: proj.h, ink: proj.ink, thumb: makeThumb(fixed), header };
}

const headerCache = new Map();

async function renderOne(file) {
  const src = state.sources.get(file.id);
  if (!src?.file) {
    file.didLayout = true;
    file.layoutError = "Source not in memory";
    return;
  }
  const buf = await src.file.arrayBuffer();
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), standardFontDataUrl: fontBase(), disableAutoFetch: true }).promise;
  try {
    const fp = await fingerprintPage(pdf, file.dominantPage || 1, state.settings);
    file.dHash = fp.dHash;
    file.projV = fp.projV;
    file.projH = fp.projH;
    file.ink = fp.ink;
    file.didLayout = true;
    file.junkLikely = looksJunk(file);
    state.thumbs.set(file.id, fp.thumb);
    if ((file.realChars || 0) < state.settings.ocrTriggerChars) headerCache.set(file.id, fp.header);
    void kvSet("thumb:" + file.id, fp.thumb);
  } finally {
    await pdf.destroy().catch(() => {});
  }
}

let tessLoader = null;
async function loadTesseract() {
  if (window.Tesseract) return window.Tesseract;
  if (tessLoader) return tessLoader;
  tessLoader = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    script.onload = () => resolve(window.Tesseract);
    script.onerror = () => reject(new Error("Tesseract failed to load"));
    document.head.appendChild(script);
  });
  return tessLoader;
}

let tessWorker = null;
let tessLang = "";
async function ocrCanvas(canvas, lang) {
  const Tesseract = await loadTesseract();
  if (!tessWorker || tessLang !== lang) {
    if (tessWorker) await tessWorker.terminate().catch(() => {});
    tessWorker = await Tesseract.createWorker(lang || "eng");
    tessLang = lang || "eng";
  }
  const result = await Promise.race([
    tessWorker.recognize(canvas),
    new Promise((_, reject) => setTimeout(() => reject(new Error("OCR timed out")), 25000)),
  ]);
  return result?.data?.text || "";
}

/* ---------- pipeline ---------- */

function yieldTick() {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

async function pool(items, n, fn) {
  let cursor = 0;
  const width = Math.max(1, Math.min(4, n || 2));
  async function worker() {
    while (!state.pause) {
      const index = cursor++;
      if (index >= items.length) return;
      try { await fn(items[index], index); }
      catch (err) { logActivity((items[index]?.name || "File") + " — " + (err.message || err)); }
      if (index % 2 === 0) {
        paintStatus();
        await yieldTick();
      }
    }
  }
  await Promise.all(Array.from({ length: width }, worker));
}

function recluster() {
  const result = clusterFiles(state.files, { ...state.settings, layoutComplete: state.layoutComplete });
  state.groups = result.groups;
  for (const group of state.groups) {
    const hint = group.familyKey === "junk" ? "junk"
      : group.familyKey === "unsorted" ? "unsorted"
        : group.familyKey === "quarantine" ? "quarantine"
          : group.familyKey === "filtered" ? "filtered"
            : suggestSlug(familyMembers(group.familyKey));
    const meta = ensureMeta(group.familyKey, hint);
    if (!meta.slugTouched) meta.slug = hint;
  }
}

function familyMembers(familyKey) {
  return state.groups.filter((g) => g.familyKey === familyKey).flatMap((g) => g.members);
}

async function stageRead() {
  const todo = state.files.filter((f) => !f.didRead && !f.quarantine);
  state.phase = "Reading inventory, fields, and text";
  await pool(todo, state.settings.workers, async (file) => {
    state.phase = "Reading " + file.name;
    try { await readCheap(file); }
    catch (err) {
      file.quarantine = classifyError(err);
      file.didRead = true;
      logActivity(file.name + " — " + file.quarantine);
    }
  });
}

function layoutCandidates() {
  const preview = clusterFiles(state.files, { ...state.settings, layoutComplete: false });
  const ids = new Set();
  for (const group of preview.groups) {
    if (["junk", "unsorted", "filtered", "quarantine"].includes(group.familyKey)) continue;
    const fieldBacked = group.members.some((m) => (m.fieldNames?.length || 0) >= 2);
    const pending = group.members.filter((m) => !m.didLayout && !m.junkLikely && !m.quarantine);
    if (!pending.length) continue;
    if (fieldBacked && state.settings.trustFields) ids.add(pending[0].id);
    else pending.slice(0, pending.length <= 40 ? pending.length : state.settings.layoutSample || 8).forEach((m) => ids.add(m.id));
  }
  const leftovers = state.files.filter((f) =>
    f.didRead && !f.quarantine && !f.didLayout && !f.junkLikely && !f.ejected && !f.outOfRange && !isStrong(f, state.settings) && !ids.has(f.id),
  );
  return {
    priority: state.files.filter((f) => ids.has(f.id)),
    leftovers,
  };
}

async function stageLayout() {
  const plan = layoutCandidates();
  state.phase = "Layout fingerprints";
  await pool(plan.priority, Math.min(2, state.settings.workers), async (file) => {
    state.phase = "Layout " + file.name;
    try { await renderOne(file); }
    catch (err) {
      file.didLayout = true;
      file.layoutError = String(err.message || err).slice(0, 160);
      logActivity("Layout skipped " + file.name);
    }
  });
  if (state.pause) return;
  const doneScans = state.files.filter((f) => f.didLayout && f.capture === "scan").length;
  const room = Math.max(0, (state.imageBudget ?? state.settings.imageSampleFirst) - doneScans);
  const slice = plan.leftovers.slice(0, room);
  await pool(slice, Math.min(2, state.settings.workers), async (file) => {
    state.phase = "Layout " + file.name;
    try { await renderOne(file); }
    catch (err) {
      file.didLayout = true;
      file.layoutError = String(err.message || err).slice(0, 160);
    }
  });
  if (plan.leftovers.length > slice.length) {
    state.sampleHold = true;
    state.layoutComplete = false;
    logActivity("Rendered " + slice.length + " image-only files. " + (plan.leftovers.length - slice.length) + " still waiting.");
    return;
  }
  state.sampleHold = false;
  state.layoutComplete = true;
}

async function stageOcr() {
  const todo = state.files.filter((f) => f.didRead && !f.quarantine && !f.didOcr && !f.junkLikely && (f.realChars || 0) < state.settings.ocrTriggerChars);
  if (!todo.length) {
    for (const file of state.files) if ((file.realChars || 0) >= state.settings.ocrTriggerChars) file.didOcr = true;
    return;
  }
  state.phase = "OCR headers";
  let failed = false;
  for (const file of todo) {
    if (state.pause) return;
    if (failed) { file.didOcr = true; file.ocrError = "skipped"; continue; }
    state.phase = "OCR " + file.name;
    paintStatus();
    try {
      let canvas = state.settings.ocrHeaderOnly ? headerCache.get(file.id) : null;
      if (!canvas) {
        const src = state.sources.get(file.id);
        if (!src?.file) throw new Error("missing bytes");
        const lib = await loadPdfJs();
        const pdf = await lib.getDocument({ data: new Uint8Array(await src.file.arrayBuffer()), standardFontDataUrl: fontBase() }).promise;
        try {
          const fp = await fingerprintPage(pdf, file.dominantPage || 1, state.settings);
          canvas = state.settings.ocrHeaderOnly ? fp.header : null;
          if (!file.dHash) {
            file.dHash = fp.dHash; file.projV = fp.projV; file.projH = fp.projH; file.didLayout = true;
            state.thumbs.set(file.id, fp.thumb);
          }
          if (!state.settings.ocrHeaderOnly) {
            canvas = document.createElement("canvas");
            /* full page already shrunk inside fingerprint; header-only is the default */
            canvas = fp.header;
          }
        } finally { await pdf.destroy().catch(() => {}); }
      }
      const text = await ocrCanvas(canvas, state.settings.ocrLang);
      const norm = normalizeText(text, state.settings);
      file.ocrText = text.slice(0, 500);
      file.didOcr = true;
      if (!file.rawText) file.rawText = text.slice(0, 2500);
      let bestJac = 0;
      for (const other of state.files) {
        if (other.id === file.id || (other.realChars || 0) < state.settings.ocrTriggerChars) continue;
        bestJac = Math.max(bestJac, jaccardSets(norm.tokens, other.tokens));
      }
      if (norm.tokens.length >= state.settings.textPlaceMinTokens && bestJac >= state.settings.textJaccard) {
        file.tokens = norm.tokens;
        if (!file.revision && norm.revision) file.revision = norm.revision;
      } else if (!file.revision && norm.revision && bestJac >= 0.3) file.revision = norm.revision;
    } catch (err) {
      failed = true;
      file.didOcr = true;
      file.ocrError = String(err.message || err).slice(0, 160);
      logActivity("OCR stopped: " + file.ocrError);
    }
    await yieldTick();
  }
  headerCache.clear();
}

async function runPipeline() {
  if (state.running) return;
  if (!state.files.length) {
    setBanner("Add PDFs or load the sample library first.");
    return;
  }
  state.running = true;
  state.pause = false;
  setBanner("");
  paint();
  try {
    await stageRead();
    if (state.pause) return;
    recluster();
    paint();
    await stageLayout();
    recluster();
    paint();
    if (state.pause || state.sampleHold) return;
    await stageOcr();
    if (state.pause) return;
    recluster();
  } catch (err) {
    logActivity("Pipeline stopped: " + (err.message || err));
  } finally {
    state.running = false;
    state.phase = state.sampleHold ? "Waiting before the rest of the image pass" : "Ready for review";
    primeAll();
    await saveSession();
    paint();
  }
}

/* ---------- names ---------- */

function ensureMeta(familyKey, hint) {
  if (!state.meta[familyKey]) state.meta[familyKey] = { slug: hint || "", slugTouched: false, fieldMap: null, confirmed: {} };
  return state.meta[familyKey];
}

function blankMap() {
  return { lastname: { mode: "blank" }, first: { mode: "blank" }, date: { mode: "blank" }, case: { mode: "blank" } };
}

function ensureMap(meta) {
  if (!meta.fieldMap) meta.fieldMap = blankMap();
  for (const [slot] of SLOT_DEFS) if (!meta.fieldMap[slot]) meta.fieldMap[slot] = { mode: "blank" };
  return meta.fieldMap;
}

function presetMap(members) {
  const names = new Set(members.flatMap((m) => m.fieldNames || []));
  for (const row of PRESET_MAPS) {
    const need = String(row.match || "").split("|").map((part) => part.trim()).filter(Boolean);
    if (!need.length || !need.every((name) => names.has(name))) continue;
    const slot = (key) => (key ? { mode: "field", key } : { mode: "blank" });
    return { lastname: slot(row.lastname), first: slot(row.first), date: slot(row.date), case: slot(row.case) };
  }
  return null;
}

function fieldExamples(members, name) {
  const vals = [];
  for (const member of members) {
    const value = (member.fieldValues || {})[name];
    if (value && !vals.includes(value)) vals.push(value);
    if (vals.length >= 3) break;
  }
  return vals;
}

function slotSource(map, slot) {
  const spec = map?.[slot];
  if (!spec || spec.mode === "blank") return "Not mapped";
  if (spec.mode === "field") return spec.key;
  if (spec.mode === "regex") return "Text pattern";
  return "Not mapped";
}

function slotSample(members, map, slot) {
  for (const file of members) {
    const idn = identityOf(file, map, state.settings);
    const value = slot === "lastname" ? idn.lastname : slot === "first" ? idn.first : slot === "date" ? idn.date : idn.case;
    if (value) return value;
  }
  return "—";
}

function familyGroups(familyKey) {
  return state.groups.filter((group) => group.familyKey === familyKey);
}

function primeFamily(familyKey) {
  const members = familyMembers(familyKey);
  if (!members.some((member) => member.didRead)) return;
  const meta = ensureMeta(familyKey, suggestSlug(members));
  if (!meta.fieldMap) meta.fieldMap = presetMap(members) || guessMap(members);
}

function primeAll() {
  const keys = [...new Set(reviewGroups().map((group) => group.familyKey))];
  for (const key of keys) primeFamily(key);
  const ready = reviewGroups().filter((group) => group.members.some((member) => member.didRead));
  if (ready.length) suggestNames(ready, { silent: true });
}

function applyMap(group, slot, spec) {
  const members = familyMembers(group.familyKey);
  const meta = ensureMeta(group.familyKey, suggestSlug(members));
  const map = ensureMap(meta);
  map[slot] = spec;
  if (spec.mode === "field") {
    for (const [other] of SLOT_DEFS) {
      if (other !== slot && map[other]?.mode === "field" && map[other].key === spec.key) map[other] = { mode: "blank" };
    }
  }
  suggestNames(familyGroups(group.familyKey), { silent: true });
}

function guessMap(members) {
  const names = [...new Set(members.flatMap((m) => m.fieldNames || []))];
  const variance = (name) => new Set(members.map((m) => (m.fieldValues || {})[name] || "").filter(Boolean).map((v) => v.toLowerCase())).size;
  const pick = (re) => names.filter((n) => re.test(n) && !/ssn|tin|taxid/i.test(n)).sort((a, b) => variance(b) - variance(a))[0] || "";
  const last = pick(/last|surname|lname/i) || pick(/^name$/i);
  const first = pick(/first|given|fname/i);
  const date = pick(/dob|date|signed/i);
  const caseId = pick(/case|matter|fileno|file.?no|docket/i);
  const slot = (key) => key ? { mode: "field", key } : { mode: "blank" };
  return { lastname: slot(last), first: slot(first), date: slot(date), case: slot(caseId) };
}

function slotValue(file, spec, regexes, slot) {
  const values = file.fieldValues || {};
  if (spec?.mode === "regex" && spec.pattern) {
    try {
      const match = new RegExp(spec.pattern, "i").exec(file.rawText || "");
      return ((match && (match[1] || match[0])) || "").trim();
    } catch { return ""; }
  }
  if (spec?.mode === "blank") {
    /* still try this file's own fields before regex */
  } else if (spec?.mode === "field" && spec.key && values[spec.key]) return values[spec.key];
  const slotRe = {
    lastname: /last|surname|lname/i,
    first: /first|given|fname/i,
    date: /dob|date|signed/i,
    case: /case|matter|fileno|docket/i,
  }[slot];
  if (slotRe) {
    const hit = (file.fieldNames || []).find((name) => slotRe.test(name) && !/ssn|tin|taxid/i.test(name) && values[name]);
    if (hit) return values[hit];
  }
  if (spec?.mode === "field") return "";
  for (const re of regexes || []) {
    const match = re.exec(file.rawText || "");
    if (match) return (match[1] || "").trim();
  }
  return "";
}

function identityOf(file, map, settings) {
  const raw = file.rawText || "";
  const withoutRev = raw.replace(/\brev(?:ision)?\.?\s*[:#]?\s*\d{1,2}[\/.\-]\d{2,4}/i, " ");
  const dateHit = withoutRev.match(/\b(\d{4}-\d{2}-\d{2}|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})\b/);
  let dateRaw = slotValue(file, map?.date, [], "date");
  if (!dateRaw && dateHit) dateRaw = dateHit[1];
  if (!dateRaw && settings.useMtime && file.mtime) dateRaw = new Date(file.mtime).toISOString();
  const date = formatDate(parseLooseDate(dateRaw) || (settings.useMtime ? new Date(file.mtime) : null), settings.dateFormat, settings.timeZone);
  return {
    lastname: slotValue(file, map?.lastname, [/\blast\s*name[:\s]+([A-Za-z][A-Za-z'’\-]{1,40})/i], "lastname"),
    first: slotValue(file, map?.first, [/\bfirst\s*name[:\s]+([A-Za-z][A-Za-z'’\-]{1,40})/i], "first"),
    date,
    case: slotValue(file, map?.case, [/\bcase(?:\s*id|\s*no\.?)?[:\s#]+([A-Za-z0-9-]{3,20})/i], "case"),
  };
}

function baseName(name) {
  return String(name || "file").replace(/\.pdf$/i, "");
}

function uniqueName(name, used, selfName, collision) {
  const taken = new Set(used);
  if (selfName) taken.delete(selfName.toLowerCase());
  if (!taken.has(name.toLowerCase())) return name;
  if (collision === "skip") return "";
  const dot = name.lastIndexOf(".");
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : "";
  let i = 2;
  while (taken.has((stem + "-" + i + ext).toLowerCase()) && i < 5000) i++;
  return stem + "-" + i + ext;
}

function reviewGroups() {
  return state.groups.filter((g) => !["quarantine", "unsorted", "filtered"].includes(g.familyKey));
}

function suggestNames(groups, opts) {
  const used = new Set(state.files.map((f) => (f.name || "").toLowerCase()));
  for (const group of groups) {
    const members = familyMembers(group.familyKey);
    const meta = ensureMeta(group.familyKey, suggestSlug(members));
    if (!meta.fieldMap) meta.fieldMap = presetMap(members) || guessMap(members);
    for (const file of group.members) {
      const idn = identityOf(file, meta.fieldMap, state.settings);
      file.identity = idn;
      const proposed = fillPattern(state.settings.pattern, {
        family: meta.slug || "form",
        version: group.versionLabel,
        lastname: idn.lastname,
        first: idn.first,
        date: idn.date,
        original: baseName(file.path || file.name),
        case: idn.case,
      }, state.settings.maxPath);
      file.proposed = uniqueName(proposed, used, file.name, state.settings.collision);
      if (file.proposed) used.add(file.proposed.toLowerCase());
    }
  }
  scheduleSave();
  if (!opts?.silent) paint();
}

function confirmedGroups() {
  return state.groups.filter((g) => state.meta[g.familyKey]?.confirmed?.[g.versionKey]);
}

async function renameConfirmed() {
  const groups = confirmedGroups();
  if (!groups.length) {
    setBanner("Confirm a group before renaming. Suggest names first if the proposed column is empty.");
    return;
  }
  const missing = groups.some((g) => g.members.some((m) => !m.proposed));
  if (missing) suggestNames(groups);
  const entries = [];
  for (const group of groups) {
    for (const file of group.members) {
      if (!file.proposed || file.proposed === file.name) continue;
      entries.push({ fileId: file.id, from: file.name, to: file.proposed, path: file.path || file.name });
    }
  }
  if (!entries.length) { setBanner("Nothing to rename. Proposed names match the current names."); return; }
  const anyHandle = entries.some((e) => state.sources.get(e.fileId)?.handle && typeof state.sources.get(e.fileId).handle.move === "function");
  const batchId = "b" + Date.now().toString(36);
  if (state.settings.renameMode === "inplace" && !anyHandle) {
    downloadText("quire-rename-plan.csv", toCsv(entries.map((e) => ({ ...e, ok: false, error: "no folder handle" }))));
    downloadText("quire-rename-log.jsonl", entries.map((e) => JSON.stringify({ batch: batchId, ...e, planned: true })).join("\n") + "\n");
    state.batches.push({ id: batchId, ts: new Date().toISOString(), planned: true, entries });
    setBanner("These files were not opened from a writable folder, so nothing was renamed. A plan and a log downloaded. Use Open folder in Chrome or Edge to rename in place.");
    scheduleSave();
    return;
  }
  if (state.dirHandle) {
    try {
      await appendLog(state.dirHandle, entries.map((e) => JSON.stringify({ batch: batchId, from: e.from, to: e.to, path: e.path, ts: new Date().toISOString() })));
    } catch (err) {
      setBanner("Stopped before renaming: could not write quire-rename-log.jsonl (" + (err.message || err) + ").");
      return;
    }
  }
  const done = [];
  for (const entry of entries) {
    const src = state.sources.get(entry.fileId);
    try {
      if (state.settings.renameMode === "copy") {
        if (!state.dirHandle) throw new Error("Copy needs an opened folder");
        const dest = await state.dirHandle.getDirectoryHandle("quire-out", { create: true });
        const handle = await dest.getFileHandle(entry.to, { create: true });
        const writable = await handle.createWritable();
        await writable.write(await src.file.arrayBuffer());
        await writable.close();
      } else {
        await src.handle.move(entry.to);
      }
      entry.ok = true;
      const file = state.files.find((f) => f.id === entry.fileId);
      if (file && state.settings.renameMode !== "copy") file.name = entry.to;
    } catch (err) {
      entry.ok = false;
      entry.error = String(err.message || err).slice(0, 180);
    }
    done.push(entry);
  }
  state.batches.push({ id: batchId, ts: new Date().toISOString(), entries: done });
  const bad = done.filter((e) => !e.ok).length;
  setBanner(bad ? bad + " of " + done.length + " renames failed. The log is in the folder when a folder is open." : "Renamed " + done.length + " files. Undo is available.");
  logActivity("Rename batch " + batchId);
  scheduleSave();
  paint();
}

async function undoLast() {
  const batch = [...state.batches].reverse().find((b) => !b.undone && b.entries?.some((e) => e.ok));
  if (!batch) { setBanner("No applied rename to undo."); return; }
  for (const entry of [...batch.entries].reverse()) {
    if (!entry.ok) continue;
    const src = state.sources.get(entry.fileId);
    try {
      if (state.settings.renameMode === "copy" && state.dirHandle) {
        const dest = await state.dirHandle.getDirectoryHandle("quire-out");
        await dest.removeEntry(entry.to);
      } else if (src?.handle?.move) {
        await src.handle.move(entry.from);
        const file = state.files.find((f) => f.id === entry.fileId);
        if (file) file.name = entry.from;
      }
    } catch (err) {
      logActivity("Undo failed for " + entry.to + ": " + (err.message || err));
    }
  }
  batch.undone = true;
  if (state.dirHandle) {
    await appendLog(state.dirHandle, [JSON.stringify({ undo: batch.id, ts: new Date().toISOString() })]).catch(() => {});
  }
  setBanner("Undid batch " + batch.id + ".");
  scheduleSave();
  paint();
}

async function appendLog(dir, lines) {
  const handle = await dir.getFileHandle("quire-rename-log.jsonl", { create: true });
  const prev = await (await handle.getFile()).text();
  const writable = await handle.createWritable();
  await writable.write(prev + (prev && !prev.endsWith("\n") ? "\n" : "") + lines.join("\n") + "\n");
  await writable.close();
}

function toCsv(entries) {
  const cell = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return "from,to,path,ok,error\n" + entries.map((e) => [e.from, e.to, e.path, e.ok, e.error || ""].map(cell).join(",")).join("\n");
}

function downloadText(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function openDry() {
  const groups = confirmedGroups();
  if (!groups.length) { setBanner("Confirm at least one group. Dry run only lists confirmed groups."); return; }
  if (groups.some((g) => g.members.some((m) => !m.proposed))) suggestNames(groups);
  const rows = groups.flatMap((g) => g.members.map((f) => `<tr><td>${esc(f.name)}</td><td>${esc(f.proposed || "—")}</td><td>${esc(state.meta[g.familyKey]?.slug || "")} · ${esc(g.versionLabel)}</td></tr>`));
  const dlg = $("dry");
  dlg.innerHTML = `<form method="dialog" class="stack"><h2>Dry run</h2><p class="hint">${rows.length} files in confirmed groups. Nothing is renamed yet.</p><table><thead><tr><th>Original</th><th>Proposed</th><th>Group</th></tr></thead><tbody>${rows.join("")}</tbody></table><div class="detail-bar"><button class="btn" value="close">Close</button><button class="btn primary" id="dryGo" type="button" value="go">Rename these</button></div></form>`;
  dlg.showModal();
  dlg.querySelector("#dryGo").onclick = () => { dlg.close(); void renameConfirmed(); };
}

/* ---------- samples ---------- */

const SCAN_VARIANTS = [
  { angle: 2, contrast: 0.96, brightness: 1, bg: "#d7d0c2", dx: 6, dy: 4, scribble: false },
  { angle: -1, contrast: 1.04, brightness: 0.9, bg: "#cfc6b6", dx: -4, dy: 8, scribble: true },
  { angle: 1, contrast: 0.92, brightness: 1.02, bg: "#e4ddd0", dx: 10, dy: -2, scribble: true },
];

function jpegBytes(canvas, q) {
  const url = canvas.toDataURL("image/jpeg", q);
  const bin = atob(url.split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function scanFrom(pdfBytes, variant, title) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: pdfBytes.slice(), standardFontDataUrl: fontBase() }).promise;
  try {
    const page = await pdf.getPage(1);
    const vp = page.getViewport({ scale: 1.35 });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const photo = document.createElement("canvas");
    photo.width = canvas.width + 80;
    photo.height = canvas.height + 70;
    const pctx = photo.getContext("2d");
    pctx.fillStyle = variant.bg;
    pctx.fillRect(0, 0, photo.width, photo.height);
    pctx.save();
    pctx.translate(photo.width / 2, photo.height / 2);
    pctx.rotate((variant.angle * Math.PI) / 180);
    pctx.filter = `contrast(${variant.contrast}) brightness(${variant.brightness})`;
    pctx.drawImage(canvas, -canvas.width / 2 + variant.dx, -canvas.height / 2 + variant.dy);
    pctx.restore();
    if (variant.scribble) {
      pctx.strokeStyle = "#243056";
      pctx.lineWidth = 2;
      pctx.beginPath();
      pctx.moveTo(photo.width * 0.18, photo.height * 0.42);
      pctx.bezierCurveTo(photo.width * 0.28, photo.height * 0.36, photo.width * 0.36, photo.height * 0.48, photo.width * 0.48, photo.height * 0.4);
      pctx.stroke();
    }
    const jpeg = jpegBytes(photo, 0.62);
    return buildImagePdf(jpeg, photo.width, photo.height, title);
  } finally {
    await pdf.destroy().catch(() => {});
  }
}

function certRects(kind) {
  if (kind === "a") return [{ x: 64, y: 360, w: 480, h: 32 }, { x: 64, y: 300, w: 480, h: 32 }, { x: 64, y: 240, w: 480, h: 32 }];
  const rects = [{ x: 48, y: 80, w: 16, h: 640 }];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) rects.push({ x: 80 + c * 250, y: 180 + r * 54, w: 220, h: 40 });
  return rects;
}

function adoptSample(name, bytes, index) {
  const file = new File([bytes], name, { type: "application/pdf", lastModified: Date.now() - index * 86400000 });
  const id = "sample:" + fnv(name + ":" + index);
  state.files.push({ id, name, path: name, size: file.size, mtime: file.lastModified, didRead: false });
  state.sources.set(id, { file, handle: null });
}

/* ---------- storage ---------- */

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("quire", 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function kvSet(key, value) {
  const db = await idb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(value, key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function kvGet(key) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readonly");
    const req = tx.objectStore("kv").get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function kvDel(key) {
  const db = await idb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").delete(key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { void saveSession(); }, 400);
}
async function saveSession() {
  try {
    await kvSet("files", state.files);
    await kvSet("settings", state.settings);
    await kvSet("meta", state.meta);
    await kvSet("batches", state.batches);
    await kvSet("flags", { layoutComplete: state.layoutComplete, imageBudget: state.imageBudget });
  } catch (err) {
    logActivity("Could not save session: " + (err.message || err));
  }
}
async function loadSession() {
  try {
    const files = await kvGet("files");
    const settings = await kvGet("settings");
    const meta = await kvGet("meta");
    const batches = await kvGet("batches");
    const flags = await kvGet("flags");
    if (settings) state.settings = { ...DEFAULTS, ...settings };
    if (meta) state.meta = meta;
    if (batches) state.batches = batches;
    if (flags) {
      state.layoutComplete = !!flags.layoutComplete;
      state.imageBudget = flags.imageBudget ?? state.settings.imageSampleFirst;
    }
    if (Array.isArray(files) && files.length) {
      state.files = files;
      recluster();
      logActivity("Restored " + files.length + " fingerprints. Reopen the folder to rename, or load samples.");
    }
    const dir = await kvGet("dir").catch(() => null);
    if (dir && dir.queryPermission) state.dirHandle = dir;
  } catch { /* private mode */ }
}
async function clearSession() {
  state.files = [];
  state.sources.clear();
  state.meta = {};
  state.batches = [];
  state.groups = [];
  state.thumbs.clear();
  state.layoutComplete = false;
  headerCache.clear();
  await kvDel("files").catch(() => {});
  await kvDel("meta").catch(() => {});
  await kvDel("batches").catch(() => {});
  paint();
}

/* ---------- UI ---------- */

function esc(s) {
  const amp = String.fromCharCode(38);
  return String(s ?? "")
    .replaceAll(amp, amp + "amp;")
    .replaceAll("<", amp + "lt;")
    .replaceAll(">", amp + "gt;")
    .replaceAll('"', amp + "quot;")
    .replaceAll("'", amp + "#39;");
}

function logActivity(msg) {
  state.activity.unshift(String(msg));
  state.activity = state.activity.slice(0, 8);
  const log = $("log");
  if (log) log.innerHTML = state.activity.map((line) => `<p>${esc(line)}</p>`).join("");
}

function setBanner(text) {
  state.banner = text || "";
  const el = $("banner");
  if (!el) return;
  el.textContent = state.banner;
  el.classList.toggle("hidden", !state.banner);
}

function layoutDone(file) {
  if (!file.didRead) return false;
  if (file.didLayout || file.junkLikely || file.quarantine || file.outOfRange) return true;
  if (state.settings.trustFields && (file.fieldNames?.length || 0) >= 2 && file.capture !== "scan") return true;
  return false;
}
function ocrDone(file) {
  if (!file.didRead) return false;
  if (file.didOcr || file.junkLikely || file.quarantine) return true;
  return (file.realChars || 0) >= state.settings.ocrTriggerChars;
}

function paintStatus() {
  const total = state.files.length;
  const read = state.files.filter((f) => f.didRead).length;
  $("status").textContent = state.phase || "Idle";
  $("counts").textContent = total ? total + " files" : "";
  const frac = total ? read / total : 0;
  $("bar").style.width = Math.round(frac * 100) + "%";
  $("pause").disabled = !state.running;
  $("pause").textContent = state.pause ? "Paused" : "Pause";
  $("run").disabled = state.running;
  $("run").textContent = state.sampleHold && !state.running ? "Continue layout" : "Run pipeline";
  const stages = [
    ["Inventory", state.files.filter((f) => f.didRead).length, total],
    ["Digital fields", state.files.filter((f) => f.didRead).length, total],
    ["Text", state.files.filter((f) => f.didRead).length, total],
    ["Layout", state.files.filter(layoutDone).length, total],
    ["OCR", state.files.filter(ocrDone).length, total],
    ["Groups", state.groups.filter((g) => !["quarantine", "unsorted", "filtered"].includes(g.familyKey)).length, null],
    ["Quarantine", state.files.filter((f) => f.quarantine).length, null],
  ];
  const current = state.phase.toLowerCase();
  $("stages").innerHTML = stages.map((row, i) => {
    const on = current.includes(row[0].toLowerCase().slice(0, 4));
    const count = row[2] == null ? String(row[1]) : row[1] + " / " + row[2];
    return `<button type="button" class="stage${on ? " on" : ""}" data-act="stage" data-label="${esc(row[0])}"><span class="num">${String(i + 1).padStart(2, "0")}</span><span>${esc(row[0])}</span><span class="count">${esc(count)}</span></button>`;
  }).join("");
}

let boardSig = "";
function paintBoard() {
  const board = $("board");
  if (!state.files.length) {
    boardSig = "empty";
    board.innerHTML = `<div class="empty"><h2>Sort the stack before you rename it</h2><p>Open a folder of PDFs. Quire reads fields and text first, renders a layout hash only for what those cannot place, and OCRs a header band only when the page has almost no text.</p><ol><li>Inventory, AcroForm fields, and a cleaned header token set.</li><li>Perceptual hash and line profile, deskewed and cropped.</li><li>You name the family once, confirm the group, then dry-run the rename.</li></ol></div>`;
    return;
  }
  const families = new Map();
  for (const group of state.groups) {
    if (!families.has(group.familyKey)) families.set(group.familyKey, []);
    families.get(group.familyKey).push(group);
  }
  const order = [...families.entries()].sort((a, b) => rankFamily(a[0]) - rankFamily(b[0]) || b[1].reduce((s, g) => s + g.members.length, 0) - a[1].reduce((s, g) => s + g.members.length, 0));
  const sig = order.map(([key, groups]) => key + ":" + groups.map((g) => g.id + "x" + g.members.length + (state.meta[key]?.confirmed?.[g.versionKey] ? "y" : "n") + (state.meta[key]?.slug || "")).join(",")).join("|") + "#" + state.selected;
  if (sig === boardSig) return;
  boardSig = sig;
  if (!order.length) {
    board.innerHTML = `<div class="empty"><h2>No groups yet</h2><p>Add PDFs and run the pipeline. Open a group, then use Map to point each field at last name, first name, date, or case.</p></div>`;
    return;
  }
  board.innerHTML = order.map(([key, groups]) => {
    const members = groups.flatMap((g) => g.members);
    const meta = ensureMeta(key, key === "junk" ? "junk" : suggestSlug(members));
    const mix = mixLine(members);
    return `<section class="family"><div class="family-head"><input class="slug" aria-label="Family slug" data-act="slug" data-family="${esc(key)}" value="${esc(meta.slug || "")}" ${key === "quarantine" ? "disabled" : ""} /><span class="hint">${groups.length} version${groups.length === 1 ? "" : "s"} · ${members.length} files · ${esc(mix)}</span><button type="button" class="mini" data-act="confirm-family" data-family="${esc(key)}">Confirm family</button></div><div class="cards">${groups.map((g) => cardHtml(g, meta)).join("")}</div></section>`;
  }).join("");
  void fillThumbs(board);
}

function rankFamily(key) {
  if (key === "quarantine") return 3;
  if (key === "unsorted" || key === "filtered") return 2;
  if (key === "junk") return 1;
  return 0;
}

function mixLine(members) {
  const fillable = members.filter((m) => m.capture === "fillable").length;
  const digital = members.filter((m) => m.capture === "digital").length;
  const scan = members.filter((m) => m.capture === "scan").length;
  return [fillable && fillable + " fillable", digital && digital + " text", scan && scan + " scans"].filter(Boolean).join(" · ") || "unread";
}

function cardHtml(group, meta) {
  const conf = confidence(group);
  const yes = !!meta.confirmed?.[group.versionKey];
  const on = state.selected === group.id;
  const bad = group.familyKey === "quarantine" || group.familyKey === "junk";
  const thumbs = group.members.slice(0, 4).map((m) => state.thumbs.has(m.id)
    ? `<img alt="" data-thumb="${esc(m.id)}" />`
    : `<div class="ghost" data-thumb="${esc(m.id)}"></div>`).join("");
  const pages = mode(group.members.map((m) => m.pageCount || 1));
  const bucket = mode(group.members.map((m) => m.sizeBucket || ""));
  const packet = group.members.some((m) => m.packet) ? " · packet" : "";
  const options = state.groups
    .filter((g, i, arr) => arr.findIndex((x) => x.familyKey === g.familyKey) === i && g.familyKey !== group.familyKey && !["quarantine", "filtered"].includes(g.familyKey))
    .map((g) => `<option value="${esc(g.familyKey)}">${esc(state.meta[g.familyKey]?.slug || g.familyKey)}</option>`)
    .join("");
  return `<article class="card${on ? " is-on" : ""}${yes ? " is-yes" : ""}${bad ? " is-bad" : ""}" data-act="select" data-id="${esc(group.id)}"><div class="thumbs">${thumbs}</div><div class="card-top"><h3>${esc(group.versionLabel)}</h3><span class="pill ${conf.level === "High" ? "high" : "review"}">${esc(conf.level)}</span></div><p class="why">${esc(conf.why)}</p><p class="mix">${esc(mixLine(group.members))} · ${esc(pages)}p · ${esc(bucket)}${packet}</p><div class="card-actions"><button type="button" class="mini" data-act="confirm" data-id="${esc(group.id)}">${yes ? "Confirmed" : "Confirm"}</button><button type="button" class="mini" data-act="junk" data-id="${esc(group.id)}">Junk</button>${options ? `<label class="hint">Version of <select data-act="relink" data-id="${esc(group.id)}"><option value="">Keep</option>${options}</select></label>` : ""}</div></article>`;
}

function mode(list) {
  const counts = new Map();
  for (const item of list) counts.set(item, (counts.get(item) || 0) + 1);
  return [...counts.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] ?? "";
}

async function fillThumbs(root) {
  for (const node of root.querySelectorAll("[data-thumb]")) {
    const id = node.getAttribute("data-thumb");
    let url = state.thumbs.get(id);
    if (!url) {
      url = await kvGet("thumb:" + id).catch(() => null);
      if (url) state.thumbs.set(id, url);
    }
    if (url && node.tagName === "IMG") node.src = url;
    else if (url && node.classList.contains("ghost")) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = url;
      node.replaceWith(img);
    }
  }
}

function mapPanel(group, meta) {
  const members = familyMembers(group.familyKey);
  const map = meta.fieldMap;
  const armed = state.arm || "lastname";
  const names = [...new Set(members.flatMap((member) => member.fieldNames || []))].sort();
  const slots = SLOT_DEFS.map(([slot, label]) => `<button type="button" class="slot${armed === slot ? " on" : ""}" data-act="arm" data-slot="${slot}" aria-pressed="${armed === slot ? "true" : "false"}"><span class="k">${label}</span><strong data-source="${slot}">${esc(slotSource(map, slot))}</strong><em data-sample="${slot}">${esc(slotSample(members, map, slot))}</em></button>`).join("");
  const fields = names.map((name) => {
    const used = SLOT_DEFS.find(([slot]) => map?.[slot]?.mode === "field" && map[slot].key === name);

  const sampleText = members.find((member) => member.rawText)?.rawText || "";

}

  const group = state.groups.find((g) => g.id === state.selected);
  if (!group) {
    el.innerHTML = `<h2>Map</h2><div class="empty"><p>Select a group. Map is how each PDF field becomes part of the new filename. Nothing is renamed until you confirm and run Rename.</p><div class="detail-bar"><button type="button" class="btn" id="suggest">Suggest names</button><button type="button" class="btn" id="dryRun">Dry run</button><button type="button" class="btn primary" id="rename">Rename</button><button type="button" class="btn" id="undo">Undo last batch</button></div></div>`;
    return;
  }
  const meta = ensureMeta(group.familyKey, suggestSlug(group.members));
  const files = group.members.slice(0, 150);
  el.innerHTML = `<h2>Map · ${esc(meta.slug || "Group")}</h2>
    <div class="detail-bar">
      <button type="button" class="btn" id="suggest">Suggest names</button>
      <button type="button" class="btn" id="dryRun">Dry run</button>
      <button type="button" class="btn primary" id="rename">Rename</button>
      <button type="button" class="btn" id="undo">Undo last batch</button>
      <button type="button" class="btn" id="split">Split checked</button>
    </div>
    ${mapPanel(group, meta)}
    <label class="hint">Filter <input id="filter" value="${esc(state.query || "")}" placeholder="Name" /></label>
    <p class="hint">${files.length} of ${group.members.length} files in this version · ${esc(group.versionLabel)} · ${esc(state.settings.pattern)}</p>
    ${files.map((f) => `<div class="file"><label class="check"><input type="checkbox" data-act="check" data-file="${esc(f.id)}" ${state.checked.has(f.id) ? "checked" : ""}/><span><strong>${esc(f.name)}</strong><br/><span class="proposed" data-proposed="${esc(f.id)}">${esc(f.proposed || "—")}</span><br/><span class="hint">${esc(fileHint(f))}</span></span></label><div class="row-actions"><button type="button" class="mini" data-act="eject" data-file="${esc(f.id)}">Not this form</button>${(f.realChars || 0) < 40 ? `<button type="button" class="mini" data-act="deep" data-file="${esc(f.id)}">Deep OCR</button>` : ""}</div></div>`).join("")}`;
}

function fileHint(file) {
  if (file.quarantine) return file.quarantine;
  const idn = file.identity;
  const who = idn ? [idn.lastname, idn.first, idn.date, idn.case].filter(Boolean).join(" · ") : "";
  const bits = [
    file.capture,
    (file.pageCount || "?") + "p",
    file.sizeBucket,
    file.producer && file.producer.slice(0, 32),
    file.packet && "packet p" + (file.dominantPage || ""),
    who,
    file.layoutError,
    file.ocrError,
  ];
  return bits.filter(Boolean).join(" · ");
}

function paint() {
  paintStatus();
  paintBoard();
  paintDetail();
  bindDetail();
}

function bindDetail() {
  $("suggest")?.addEventListener("click", () => suggestNames(reviewGroups()));
  $("dryRun")?.addEventListener("click", openDry);
  $("rename")?.addEventListener("click", () => { void renameConfirmed(); });
  $("undo")?.addEventListener("click", () => { void undoLast(); });
  $("split")?.addEventListener("click", splitChecked);
  $("guess")?.addEventListener("click", () => {
    const group = state.groups.find((g) => g.id === state.selected);
    if (!group) return;
    const meta = ensureMeta(group.familyKey);
    meta.fieldMap = guessMap(familyMembers(group.familyKey));
    suggestNames(familyGroups(group.familyKey));
  });
  $("filter")?.addEventListener("input", (event) => {
    const q = event.target.value.toLowerCase();
    state.query = q;
    for (const row of $("detail").querySelectorAll(".file")) {
      const text = row.textContent.toLowerCase();
      row.classList.toggle("hidden", q && !text.includes(q));
    }
  });
  for (const input of $("detail").querySelectorAll("[data-act=regex]")) {
    input.addEventListener("input", onRegexInput);
  }
}

function onRegexInput(event) {
  const group = state.groups.find((g) => g.id === state.selected);
  if (!group) return;
  const pattern = event.target.value;
  applyMap(group, event.target.dataset.slot, pattern.trim() ? { mode: "regex", pattern } : { mode: "blank" });
  syncMapReadout(group);
}

function syncMapReadout(group) {
  const meta = state.meta[group.familyKey];
  const members = familyMembers(group.familyKey);
  const map = meta?.fieldMap;
  for (const file of members) {
    const node = document.querySelector('[data-proposed="' + CSS.escape(file.id) + '"]');
    if (node) node.textContent = file.proposed || "—";
  }
  for (const [slot] of SLOT_DEFS) {
    const sample = document.querySelector('[data-sample="' + slot + '"]');
    if (sample) sample.textContent = slotSample(members, map, slot);
    const source = document.querySelector('[data-source="' + slot + '"]');
    if (source) source.textContent = slotSource(map, slot);
  }
  const armed = state.arm || "lastname";
  for (const row of document.querySelectorAll(".field-row")) {
    const name = row.dataset.field;
    const used = SLOT_DEFS.find(([slot]) => map?.[slot]?.mode === "field" && map[slot].key === name);
    row.classList.toggle("on", !!(used && used[0] === armed));
    const badge = row.querySelector(".fused");
    if (badge) badge.textContent = used ? used[1] : "Use";
  }
}

function showPane(name) {
  document.querySelectorAll(".tabs button").forEach((btn) => btn.setAttribute("aria-selected", btn.dataset.pane === name ? "true" : "false"));
  document.querySelectorAll("[data-pane-body]").forEach((pane) => pane.classList.toggle("on", pane.dataset.paneBody === name));
}

function onBoardClick(event) {
  const target = event.target.closest("[data-act]");
  if (!target) return;
  const act = target.dataset.act;
  if (act === "slug") return;
  if (act === "select") {
    state.selected = target.dataset.id;
    primeFamily(state.groups.find((g) => g.id === state.selected)?.familyKey || "");
    const picked = state.groups.find((g) => g.id === state.selected);
    if (picked && familyGroups(picked.familyKey).some((g) => g.members.some((m) => m.didRead && !m.proposed))) {
      suggestNames(familyGroups(picked.familyKey), { silent: true });
    }
    boardSig = "";
    paint();
    if (matchMedia("(max-width: 959px)").matches) showPane("detail");
    return;
  }
  if (act === "confirm") {
    const group = state.groups.find((g) => g.id === target.dataset.id);
    if (!group) return;
    const meta = ensureMeta(group.familyKey);
    meta.confirmed[group.versionKey] = !meta.confirmed[group.versionKey];
    boardSig = "";
    scheduleSave();
    paint();
  }
  if (act === "confirm-family") {
    for (const group of state.groups.filter((g) => g.familyKey === target.dataset.family)) {
      ensureMeta(group.familyKey).confirmed[group.versionKey] = true;
    }
    boardSig = "";
    scheduleSave();
    paint();
  }
  if (act === "junk") {
    const group = state.groups.find((g) => g.id === target.dataset.id);
    if (!group) return;
    for (const file of group.members) { file.forceJunk = true; file.manualFamilyId = null; file.ejected = false; }
    boardSig = "";
    recluster();
    scheduleSave();
    paint();
  }
  if (act === "stage") {
    const label = target.dataset.label;
    const group = state.groups.find((g) => (label === "Quarantine" && g.familyKey === "quarantine"));
    if (group) { state.selected = group.id; boardSig = ""; paint(); }
  }
}

function onBoardChange(event) {
  const target = event.target;
  if (target.dataset.act === "slug") {
    const meta = ensureMeta(target.dataset.family);
    meta.slug = sanitizeToken(target.value).toLowerCase() || target.value.trim();
    meta.slugTouched = true;
    scheduleSave();
    return;
  }
  if (target.dataset.act === "relink" && target.value) {
    const group = state.groups.find((g) => g.id === target.dataset.id);
    if (!group) return;
    for (const file of group.members) {
      file.manualFamilyId = target.value;
      file.manualVersion = group.versionKey;
      file.forceJunk = false;
      file.ejected = false;
    }
    state.selected = null;
    recluster();
    scheduleSave();
    boardSig = "";
    paint();
  }
  if (target.dataset.act === "map") {
    const group = state.groups.find((g) => g.id === state.selected);
    if (!group) return;
    const value = target.value;
    const spec = !value ? { mode: "blank" } : value === "__regex" ? { mode: "regex", pattern: target.dataset.slot === "date" ? "(\\d{1,2}[/.-]\\d{1,2}[/.-]\\d{2,4})" : "([A-Za-z][A-Za-z' -]{1,40})" } : { mode: "field", key: value };
    applyMap(group, target.dataset.slot, spec);
    paint();
  }
  if (target.dataset.act === "check") {
    if (target.checked) state.checked.add(target.dataset.file);
    else state.checked.delete(target.dataset.file);
  }
}

function splitChecked() {
  const ids = [...state.checked];
  if (!ids.length) { setBanner("Check files in the table, then split."); return; }
  const family = "manual:" + fnv(ids.join("|") + Date.now());
  for (const file of state.files) {
    if (!ids.includes(file.id)) continue;
    file.manualFamilyId = family;
    file.manualVersion = "split";
    file.forceJunk = false;
    file.ejected = false;
  }
  state.checked.clear();
  recluster();
  scheduleSave();
  boardSig = "";
  paint();
}

async function deepOcr(file) {
  state.phase = "Deep OCR " + file.name;
  paintStatus();
  try {
    const src = state.sources.get(file.id);
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: new Uint8Array(await src.file.arrayBuffer()), standardFontDataUrl: fontBase() }).promise;
    const page = await pdf.getPage(file.dominantPage || 1);
    const vp = page.getViewport({ scale: 1.4 });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    await pdf.destroy().catch(() => {});
    const text = await ocrCanvas(canvas, state.settings.ocrLang);
    const norm = normalizeText(text, state.settings);
    file.ocrText = text.slice(0, 800);
    file.rawText = text.slice(0, 2500);
    file.didOcr = true;
    if (norm.tokens.length) file.tokens = norm.tokens;
    if (norm.revision) file.revision = norm.revision;
    logActivity("Deep OCR finished for " + file.name);
    recluster();
    paint();
  } catch (err) {
    setBanner("Deep OCR failed: " + (err.message || err));
  }
}

function buildSettings() {
  const s = state.settings;
  const num = (key, label, step) => `<label>${label}<input data-key="${key}" type="number" step="${step || "1"}" value="${esc(s[key])}" /></label>`;
  const check = (key, label) => `<label><span><input data-key="${key}" type="checkbox" ${s[key] ? "checked" : ""}/> ${label}</span></label>`;
  $("settings").innerHTML = `<form method="dialog" class="stack" id="settingsForm"><h2>Advanced</h2>
    <p class="hint">Defaults are enough for a first pass. Thresholds are not averaged into one score.</p>
    <div class="grid-2">
      ${num("dpi", "Render DPI", "1")}
      ${num("skewDeg", "Skew tolerance (degrees)", "1")}
      ${num("textJaccard", "Text Jaccard", "0.01")}
      ${num("sharedTextMin", "Shared tokens minimum", "1")}
      ${num("fieldVersionJaccard", "Field Jaccard, same version", "0.01")}
      ${num("fieldFamilyJaccard", "Field Jaccard, same family", "0.01")}
      ${num("hashMax", "Max hash distance", "0.01")}
      ${num("projMin", "Min line-profile similarity", "0.01")}
      ${num("textPlaceMinTokens", "Tokens that count as placed", "1")}
      ${num("ocrTriggerChars", "OCR if fewer letters than", "1")}
      ${num("imageSampleFirst", "Image-only sample, then pause", "1")}
      ${num("layoutSample", "Layout samples inside a large text group", "1")}
      ${num("workers", "Read concurrency (2–4)", "1")}
      ${num("minPages", "Min pages", "1")}
      ${num("maxPages", "Max pages", "1")}
      ${num("maxPath", "Max name length", "1")}
      ${num("headerBand", "Header band (0–1)", "0.01")}
    </div>
    <label>OCR language<input data-key="ocrLang" value="${esc(s.ocrLang)}" /></label>
    <label>Date format<input data-key="dateFormat" value="${esc(s.dateFormat)}" /></label>
    <label>Time zone (blank = UTC date parts)<input data-key="timeZone" value="${esc(s.timeZone)}" placeholder="America/Denver" /></label>
    <label>Rename pattern<input data-key="pattern" value="${esc(s.pattern)}" /></label>
    <label>Collision
      <select data-key="collision"><option value="suffix"${s.collision === "suffix" ? " selected" : ""}>Suffix -2</option><option value="skip"${s.collision === "skip" ? " selected" : ""}>Skip</option></select>
    </label>
    <label>Write mode
      <select data-key="renameMode"><option value="inplace"${s.renameMode === "inplace" ? " selected" : ""}>Rename in place</option><option value="copy"${s.renameMode === "copy" ? " selected" : ""}>Copy into quire-out</option></select>
    </label>
    <label>Ignore tokens<textarea data-key="ignoreTokens" rows="3">${esc(s.ignoreTokens)}</textarea></label>
    ${check("ocrHeaderOnly", "OCR only the page-1 header band")}
    ${check("trustFields", "Trust field names over image")}
    ${check("useMtime", "If no date is found, use the file modified time")}
    <table><thead><tr><th>Signal</th><th>Good for</th><th>Weak for</th></tr></thead><tbody>
      <tr><td>AcroForm field-name set</td><td>Exact template version</td><td>Scans, flattened PDFs</td></tr>
      <tr><td>Header token overlap</td><td>Same form, different years</td><td>Hand-filled scans</td></tr>
      <tr><td>Hash after deskew and crop</td><td>Scanned copies, tilt, contrast</td><td>Forms that share a logo only</td></tr>
      <tr><td>Line-projection profile</td><td>Box layout even if text differs</td><td>Heavy stamps or folded pages</td></tr>
      <tr><td>Page count and page size</td><td>Packet versus single form</td><td>Mixed duplex scans</td></tr>
      <tr><td>Embedded revision date</td><td>Version label</td><td>Missing on old copies</td></tr>
    </tbody></table>
    <div class="detail-bar"><button class="btn primary" value="save">Save</button><button class="btn" value="cancel" type="button" id="settingsClose">Close</button><button class="btn rust" type="button" id="wipe">Clear saved fingerprints</button></div>
  </form>`;
  $("settingsClose").onclick = () => $("settings").close();
  $("wipe").onclick = () => { void clearSession(); $("settings").close(); };
  $("settingsForm").addEventListener("submit", () => {
    const next = { ...state.settings };
    for (const input of $("settingsForm").querySelectorAll("[data-key]")) {
      const key = input.dataset.key;
      if (input.type === "checkbox") next[key] = input.checked;
      else if (input.type === "number") next[key] = Number(input.value);
      else next[key] = input.value;
    }
    next.workers = Math.max(2, Math.min(4, next.workers | 0));
    state.settings = next;
    state.imageBudget = next.imageSampleFirst;
    scheduleSave();
    recluster();
    boardSig = "";
    paint();
  });
}

async function walkDir(dir, prefix, out) {
  for await (const [name, handle] of dir.entries()) {
    if (name.startsWith(".")) continue;
    if (handle.kind === "directory") {
      if (name === "node_modules" || name === "quire-out") continue;
      await walkDir(handle, prefix + name + "/", out);
    } else if (/\.pdf$/i.test(name)) {
      out.push({ file: await handle.getFile(), handle, path: prefix + name });
    }
  }
}

async function addIncoming(items) {
  let added = 0;
  for (const item of items) {
    const path = item.path || item.file.webkitRelativePath || item.file.name;
    const id = fnv([path, item.file.size, item.file.lastModified].join("|"));
    const existing = state.files.find((f) => f.id === id);
    state.sources.set(id, { file: item.file, handle: item.handle || null });
    if (existing) continue;
    state.files.push({ id, name: item.file.name, path, size: item.file.size, mtime: item.file.lastModified, didRead: false });
    added++;
  }
  logActivity(added ? "Added " + added + " PDF" + (added === 1 ? "" : "s") + "." : "No new PDFs. Existing fingerprints were kept.");
  if (added) {
    state.layoutComplete = false;
    state.imageBudget = state.settings.imageSampleFirst;
  }
  scheduleSave();
  paint();
}

async function openFolder() {
  if (!window.showDirectoryPicker) {
    setBanner("This browser cannot write back to a folder. Add PDFs instead. A rename downloads a plan.");
    $("dirPick").click();
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: "readwrite", id: "quire-folder" });
    state.dirHandle = dir;
    kvSet("dir", dir).catch(() => {});
    const found = [];
    state.phase = "Listing PDFs";
    paintStatus();
    await walkDir(dir, "", found);
    await addIncoming(found);
  } catch (err) {
    if (err?.name !== "AbortError") setBanner(String(err.message || err));
  }
}

async function downloadStandalone() {
  const tag = document.querySelector('script[type="module"][src="quire.js"]');
  let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  if (tag) {
    const js = await fetch(new URL("quire.js", document.baseURI)).then((r) => r.text());
    html = html.replace('<script type="module" src="quire.js"><\/script>', "<script type=\"module\">\n" + js.replace(/<\/script/gi, "<\\/script") + "\n<\/script>");
  }
  downloadText("quire.html", html);
  logActivity("Saved quire.html. It is one file: open it in Chrome or Edge. pdf.js uses a CDN if the vendor folder is not beside it. Edit PRESET_MAPS near the top to pin field names.");
}

function bootChecks() {
  const errors = selfCheck();
  if (errors.length) setBanner("Self-check failed: " + errors.join("; "));
  return errors;
}

function wire() {
  $("openFolder").onclick = () => { void openFolder(); };
  $("addFiles").onclick = () => $("filePick").click();
  $("samples").onclick = () => { void loadSamples(); };
  $("run").onclick = () => {
    if (state.sampleHold) { state.sampleHold = false; state.imageBudget = Infinity; }
    void runPipeline();
  };
  $("pause").onclick = () => { state.pause = true; state.phase = "Pausing…"; paintStatus(); };
  $("regroup").onclick = () => { recluster(); boardSig = ""; paint(); };
  $("openSettings").onclick = () => { buildSettings(); $("settings").showModal(); };
  $("downloadHtml").onclick = () => { void downloadStandalone(); };
  $("filePick").onchange = () => { void addIncoming([...$("filePick").files].map((file) => ({ file, path: file.name }))); $("filePick").value = ""; };
  $("dirPick").onchange = () => {
    void addIncoming([...$("dirPick").files].filter((f) => /\.pdf$/i.test(f.name)).map((file) => ({ file, path: file.webkitRelativePath || file.name })));
    $("dirPick").value = "";
  };
  $("board").addEventListener("click", onBoardClick);
  $("board").addEventListener("change", onBoardChange);
  $("rail").addEventListener("click", onBoardClick);
  $("detail").addEventListener("click", (event) => {
    const target = event.target.closest("[data-act]");
    if (!target) return;
    if (target.dataset.act === "arm") {
      state.arm = target.dataset.slot;
      for (const button of $("detail").querySelectorAll(".slot")) {
        const on = button.dataset.slot === state.arm;
        button.classList.toggle("on", on);
        button.setAttribute("aria-pressed", on ? "true" : "false");
      }
      const group = state.groups.find((g) => g.id === state.selected);
      if (group) syncMapReadout(group);
      return;
    }
    if (target.dataset.act === "assign") {
      const group = state.groups.find((g) => g.id === state.selected);
      if (!group) return;
      const slot = state.arm || "lastname";
      const field = target.dataset.field;
      const current = state.meta[group.familyKey]?.fieldMap?.[slot];
      applyMap(group, slot, current?.mode === "field" && current.key === field ? { mode: "blank" } : { mode: "field", key: field });
      paint();
      return;
    }
    if (target.dataset.act === "eject") {
      const file = state.files.find((f) => f.id === target.dataset.file);
      if (!file) return;
      file.ejected = true;
      file.manualFamilyId = null;
      file.forceJunk = false;
      recluster();
      boardSig = "";
      scheduleSave();
      paint();
    }
    if (target.dataset.act === "deep") {
      const file = state.files.find((f) => f.id === target.dataset.file);
      if (file) void deepOcr(file);
    }
  });
  $("detail").addEventListener("change", onBoardChange);
  document.querySelectorAll(".tabs button").forEach((btn) => btn.addEventListener("click", () => showPane(btn.dataset.pane)));
  const app = $("app");
  app.addEventListener("dragover", (event) => { event.preventDefault(); app.classList.add("drop"); });
  app.addEventListener("dragleave", () => app.classList.remove("drop"));
  app.addEventListener("drop", (event) => {
    event.preventDefault();
    app.classList.remove("drop");
    const files = [...(event.dataTransfer?.files || [])].filter((f) => /\.pdf$/i.test(f.name) || f.type === "application/pdf");
    if (files.length) void addIncoming(files.map((file) => ({ file, path: file.name })));
  });
  showPane("board");
}

async function boot() {
  try {
    wire();
    const errors = bootChecks();
    window.__quire = {
      selfCheck,
      loadSamples,
      run: runPipeline,
      get groups() { return state.groups; },
      get files() { return state.files; },
      get settings() { return state.settings; },
      debug: () => state.debug,
      errors,
    };
    await loadSession();
    const caps = window.showDirectoryPicker ? "In-place rename is available in this browser." : "Folder write is unavailable here. Renames download a plan.";
    if (!state.activity.length) logActivity(caps);
    state.phase = state.files.length ? "Restored fingerprints. Run the pipeline or reopen the folder." : "Open a folder or load the sample library. Nothing is renamed until you confirm a group.";
    paint();
  } catch (err) {
    const el = document.getElementById("status");
    if (el) el.textContent = "Quire failed to start: " + (err.message || err);
  }
}

void boot();

</script>
