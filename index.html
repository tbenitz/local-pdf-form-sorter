<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quire</title>
  <meta name="description" content="Sort fillable PDFs and scans into form families, then versions, then names. Nothing is uploaded." />
  <meta name="theme-color" content="#efe8da" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #efe8da;
      --surface: #f7f3ea;
      --ink: #1c1916;
      --muted: #6a6358;
      --line: #d9d0c0;
      --seal: #1b5e45;
      --on-seal: #f3faf6;
      --seal-soft: #e4f0ea;
      --rust: #8f3d2a;
      --on-rust: #fff7f4;
      --rust-soft: #f8ebe6;
      --sans: "Public Sans", ui-sans-serif, system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.45; }
    :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
    h1, h2, h3 { font-family: var(--display); font-weight: 560; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
    p { margin: 0; text-wrap: pretty; }
    .app { height: 100dvh; display: flex; flex-direction: column; min-height: 0; }
    header.top {
      display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
      justify-content: space-between; padding: 14px 16px 10px;
    }
    .brand { min-width: 0; }
    h1 { font-size: 1.75rem; line-height: 1; }
    .tag { color: var(--muted); font-size: 0.875rem; margin-top: 4px; max-width: 36rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button.btn, .btn {
      min-height: 44px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    }
    button.primary { background: var(--seal); border-color: var(--seal); color: var(--on-seal); }
    button.rust { background: var(--rust); border-color: var(--rust); color: var(--on-rust); }
    button.ghost { background: transparent; }
    .status-row {
      display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
      padding: 0 16px 8px; color: var(--muted); font-size: 0.875rem;
    }
    #status { color: var(--ink); }
    .meter { height: 3px; background: var(--line); }
    .meter > span { display: block; height: 100%; width: 0; background: var(--seal); transition: width 160ms ease; }
    .tabs { display: none; gap: 8px; padding: 8px 16px 0; }
    .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .panes { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr; }
    .pane { min-height: 0; min-width: 0; overflow: auto; padding: 12px 16px 24px; }
    .pane h2 { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    @media (min-width: 960px) {
      .tabs { display: none !important; }
      .panes { grid-template-columns: 220px minmax(0, 1fr) minmax(300px, 440px); }
      .pane { display: block !important; border-left: 1px solid var(--line); }
      #rail { border-left: 0; }
    }
    @media (max-width: 959px) {
      .tabs { display: flex; }
      .pane { display: none; }
      .pane.on { display: block; }
    }
    .stage {
      width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px;
      align-items: center; text-align: left; background: transparent; border: 0;
      border-left: 2px solid var(--line); border-radius: 0; min-height: 40px; padding: 4px 8px;
      color: var(--ink);
    }
    .stage.on { border-left-color: var(--seal); background: var(--seal-soft); }
    .stage .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.75rem; }
    .stage .count { font-variant-numeric: tabular-nums; color: var(--muted); }
    .log { margin-top: 16px; display: grid; gap: 4px; }
    .log p { font-size: 0.75rem; color: var(--muted); }
    .family { margin-bottom: 18px; }
    .family-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .slug {
      font-family: var(--display); font-size: 1.35rem; background: transparent;
      border: 0; border-bottom: 1px solid var(--line); min-height: 44px; padding: 0 4px; width: min(100%, 220px);
    }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px; display: grid; gap: 6px; text-align: left; width: 100%;
    }
    .card.is-on { border-color: var(--seal); box-shadow: inset 0 0 0 1px var(--seal); }
    .card.is-yes { background: var(--seal-soft); }
    .card.is-junk, .card.is-bad { background: var(--rust-soft); }
    .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; height: 72px; }
    .thumbs img, .ghost { width: 100%; height: 72px; object-fit: cover; border-radius: 4px; background: #fff; border: 1px solid var(--line); }
    .ghost {
      background:
        linear-gradient(var(--line), var(--line)) 8px 16px / calc(100% - 16px) 1px no-repeat,
        linear-gradient(var(--line), var(--line)) 8px 28px / 70% 1px no-repeat,
        linear-gradient(var(--line), var(--line)) 8px 40px / calc(100% - 16px) 1px no-repeat,
        linear-gradient(var(--line), var(--line)) 8px 52px / 40% 1px no-repeat,
        var(--surface);
    }
    .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .card h3 { font-size: 1.05rem; }
    .pill { font-size: 0.75rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
    .pill.high { background: var(--seal-soft); border-color: transparent; color: var(--seal); }
    .pill.review { color: var(--rust); }
    .why, .mix, .hint { font-size: 0.8125rem; color: var(--muted); }
    .card-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .card-actions button, .mini {
      min-height: 36px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    }
    .card-actions select, .map select, .stack input, .stack select, .stack textarea {
      min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 6px 8px;
    }
    .empty {
      border: 1px dashed var(--line); border-radius: 12px; padding: 28px 18px; background: var(--surface);
      display: grid; gap: 8px; max-width: 40rem;
    }
    .empty ol { margin: 0; padding-left: 1.2rem; color: var(--muted); }
    .file {
      display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line);
    }
    .file strong, .file .proposed { overflow-wrap: anywhere; }
    .proposed { font-variant-numeric: tabular-nums; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .check { display: flex; gap: 8px; align-items: flex-start; }
    .detail-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .map { display: grid; gap: 8px; margin: 4px 0 14px; }
    .map label, .stack label { display: grid; gap: 4px; font-size: 0.8125rem; color: var(--muted); }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .slot {
      text-align: left; border: 1px solid var(--line); background: var(--surface);
      border-radius: 10px; padding: 8px 10px; min-height: 76px; display: grid; align-content: center; gap: 2px;
    }
    .slot.on { border-color: var(--seal); background: var(--seal-soft); box-shadow: inset 0 0 0 1px var(--seal); }
    .slot .k { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .slot strong, .fname { overflow-wrap: anywhere; }
    .slot em { font-style: normal; color: var(--muted); font-size: 0.8125rem; overflow-wrap: anywhere; }
    .field-list { display: grid; gap: 6px; }
    .field-row {
      width: 100%; text-align: left; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline;
      border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 44px;
    }
    .field-row.on { border-color: var(--seal); background: var(--seal-soft); }
    .fname { font-weight: 600; flex: 1 1 8rem; }
    .fvals { color: var(--muted); font-size: 0.8125rem; flex: 1 1 8rem; overflow-wrap: anywhere; }
    .fused { font-size: 0.75rem; margin-left: auto; }
    .textmap { display: grid; gap: 8px; }
    .textmap summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
    .snip {
      white-space: pre-wrap; font-size: 0.75rem; line-height: 1.4; background: #fff;
      border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-height: 9rem; overflow: auto; margin: 0;
    }
    dialog {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 12px; width: min(720px, calc(100vw - 24px)); max-height: min(80dvh, 760px);
      padding: 16px; overflow: auto;
    }
    dialog::backdrop { background: rgba(28, 25, 22, 0.4); }
    .stack { display: grid; gap: 10px; }
    .grid-2 { display: grid; gap: 10px; }
    @media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px 4px; vertical-align: top; }
    .drop {
      outline: 2px dashed var(--seal); outline-offset: -8px;
    }
    .banner {
      margin: 0 16px 8px; padding: 8px 10px; background: var(--rust-soft); border-radius: 8px; color: var(--ink);
      font-size: 0.875rem;
    }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <h1>Quire</h1>
        <p class="tag">Group similar PDFs, then map each field onto a filename. Files stay on this machine.</p>
      </div>
      <div class="actions">
        <button class="btn primary" id="openFolder" type="button">Open folder</button>
        <button class="btn" id="addFiles" type="button">Add PDFs</button>
        <button class="btn" id="samples" type="button">Sample library</button>
        <button class="btn" id="run" type="button">Run pipeline</button>
        <button class="btn" id="pause" type="button" disabled>Pause</button>
        <button class="btn" id="downloadHtml" type="button">Download quire.html</button>
      </div>
    </header>
    <div class="status-row">
      <p id="status">Open a folder or load the sample library. Nothing is renamed until you confirm a group.</p>
      <p id="counts"></p>
    </div>
    <div class="meter" aria-hidden="true"><span id="bar"></span></div>
    <p id="banner" class="banner hidden"></p>
    <nav class="tabs" aria-label="Panes">
      <button type="button" class="btn" data-pane="rail" aria-selected="false">Stages</button>
      <button type="button" class="btn" data-pane="board" aria-selected="true">Groups</button>
      <button type="button" class="btn" data-pane="detail" aria-selected="false">Map</button>
    </nav>
    <div class="panes">
      <aside class="pane on" id="rail" data-pane-body="rail">
        <h2>Stages</h2>
        <div id="stages"></div>
        <div class="log" id="log"></div>
        <div class="detail-bar">
          <button class="btn ghost" id="regroup" type="button">Regroup</button>
          <button class="btn ghost" id="openSettings" type="button">Advanced</button>
        </div>
      </aside>
      <section class="pane on" id="board" data-pane-body="board" aria-label="Groups"></section>
      <section class="pane" id="detail" data-pane-body="detail" aria-label="Files in the selected group"></section>
    </div>
  </div>
  <input id="filePick" type="file" accept="application/pdf,.pdf" multiple hidden />
  <input id="dirPick" type="file" accept=".pdf,application/pdf" webkitdirectory multiple hidden />
  <dialog id="settings"></dialog>
  <dialog id="dry"></dialog>
  <script type="module">
/* Quire — local form fingerprint, cluster, and rename. No upload. */

const DEFAULTS = {
  ocrLang: "eng",
  ocrHeaderOnly: true,
  dpi: 72,
  skewDeg: 3,
  textJaccard: 0.58,
  fieldVersionJaccard: 0.9,
  fieldFamilyJaccard: 0.55,
  hashMax: 0.22,
  projMin: 0.84,
  textPlaceMinTokens: 8,
  ocrTriggerChars: 40,
  sharedTextMin: 6,
  ignoreTokens:
    "page of the and for date signature sign signed print please form by to a an or if is this that with from your you our name last first middle number street city state zip address phone email dob section part line yes no not are be as at on in it we do did have has will shall must may any all other than under above below into over per via using use used following hereby declare doc document copy copies",
  minPages: 1,
  maxPages: 80,
  workers: 2,
  trustFields: true,
  imageSampleFirst: 50,
  layoutSample: 8,
  dateFormat: "yyyy-MM-dd",
  timeZone: "",
  collision: "suffix",
  maxPath: 180,
  renameMode: "inplace",
  pattern: "{family}_{version}_{lastname}_{first}_{date}_{original}",
  useMtime: false,
  headerBand: 0.22,
};

/* Optional filename maps. Edit this list in the HTML if you already know the PDF fields.
   match: field names that must all exist, separated by |
   lastname / first / date / case: the PDF field to use, or "" to leave blank
   A text pattern uses mode "regex" only from the Map panel, not from this list. */
const PRESET_MAPS = [
  // { match: "LastName|FirstName", lastname: "LastName", first: "FirstName", date: "", case: "" },
];

const SLOT_DEFS = [
  ["lastname", "Last name"],
  ["first", "First name"],
  ["date", "Date"],
  ["case", "Case"],
];

const enc = new TextEncoder();
const state = {
  settings: { ...DEFAULTS },
  files: [],
  sources: new Map(),
  meta: {},
  batches: [],
  groups: [],
  thumbs: new Map(),
  dirHandle: null,
  running: false,
  pause: false,
  sampleHold: false,
  imageBudget: DEFAULTS.imageSampleFirst,
  layoutComplete: false,
  selected: null,
  arm: "lastname",
  checked: new Set(),
  activity: [],
  debug: [],
  phase: "idle",
  banner: "",
};

const $ = (id) => document.getElementById(id);

function fnv(str) {
  let h = 0x811c9dc5;
  const s = String(str);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8, "0");
}

function jaccardSets(a, b) {
  const A = a instanceof Set ? a : new Set(a || []);
  const B = b instanceof Set ? b : new Set(b || []);
  let inter = 0;
  for (const x of A) if (B.has(x)) inter++;
  const union = A.size + B.size - inter;
  return union ? inter / union : 0;
}

function hamming(a, b) {
  if (!a || !b || a.length !== b.length) return 1;
  let n = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) n++;
  return n / a.length;
}

function cosine(a, b) {
  if (!a || !b || a.length !== b.length || !a.length) return 0;
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    na += a[i] * a[i];
    nb += b[i] * b[i];
  }
  if (!na || !nb) return 0;
  return dot / Math.sqrt(na * nb);
}

function tokenIgnore(settings) {
  return new Set(String(settings.ignoreTokens || "").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean));
}

function normalizeText(raw, settings) {
  const original = String(raw || "");
  const realChars = (original.match(/[A-Za-z]/g) || []).length;
  const revRe = /\brev(?:ision)?\.?\s*[:#]?\s*(\d{1,2}[\/.\-]\d{2,4}|\d{4})\b/i;
  const rm = revRe.exec(original);
  const revision = rm ? rm[1] : "";
  let text = original.replace(revRe, " ");
  text = text.replace(/\b(last|first|middle|patient|applicant|employee|surname|given)\s*name\b[:\-\s]+[A-Za-z][A-Za-z'’\-]{1,40}/gi, " ");
  text = text.replace(/\b\d{3}-\d{2}-\d{4}\b/g, " ");
  text = text.replace(/\$\s?\d[\d,]*\.?\d*/g, " ");
  text = text.replace(/\b[\w.+-]+@[\w.-]+\.\w+\b/g, " ");
  text = text.replace(/\b(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}\b/g, " ");
  text = text.replace(/\b\d{4}-\d{2}-\d{2}\b/g, " ");
  text = text.replace(/\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b/g, " ");
  text = text.replace(/\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4}\b/gi, " ");
  text = text.replace(/\b[A-Z]{1,4}-?\d{5,}\b/g, " ");
  text = text.replace(/\b\d{6,}\b/g, " ");
  const lower = text.toLowerCase();
  const forms = lower.match(/\b[a-z]{1,3}-?\d{1,2}\b/g) || [];
  const ignore = tokenIgnore(settings);
  const tokens = [];
  for (const p of lower.split(/[^a-z0-9]+/)) {
    if (!p || ignore.has(p) || /^\d+$/.test(p) || p.length < 4) continue;
    tokens.push(p);
  }
  for (const f of forms) {
    const compact = f.replace("-", "");
    if (!tokens.includes(compact)) tokens.push(compact);
    if (f.includes("-") && !tokens.includes(f)) tokens.push(f);
  }
  return { tokens, revision, realChars };
}

function textSig(tokens) {
  return [...new Set(tokens || [])].sort().join("|");
}

function versionSlug(rev) {
  const s = String(rev || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return s ? "rev-" + s : "";
}

function sanitizeToken(v) {
  return String(v || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "")
    .replace(/\s+/g, "-")
    .replace(/[^A-Za-z0-9._-]+/g, "")
    .replace(/-+/g, "-")
    .replace(/^[.\-_]+|[.\-_]+$/g, "")
    .slice(0, 80);
}

function clipName(name, max) {
  const limit = Math.max(12, max || 180);
  if (name.length <= limit) return name;
  const dot = name.lastIndexOf(".");
  const ext = dot > 0 ? name.slice(dot) : ".pdf";
  const stem = name.slice(0, Math.max(1, limit - ext.length)).replace(/[.\-_]+$/g, "");
  return stem + ext;
}

function fillPattern(pattern, bag, max) {
  let s = String(pattern || "").replace(/\{(family|version|lastname|first|date|original|case)\}/gi, (_, k) =>
    sanitizeToken(bag[k.toLowerCase()] || ""),
  );
  s = s.replace(/_+/g, "_").replace(/^_|_$/g, "");
  if (!s) s = "untitled";
  if (!/\.pdf$/i.test(s)) s += ".pdf";
  return clipName(s, max);
}

function parseLooseDate(value) {
  const s = String(value || "").trim();
  if (!s) return null;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return new Date(Date.UTC(+iso[1], +iso[2] - 1, +iso[3]));
  const mdy = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (!mdy) return null;
  let y = +mdy[3];
  if (y < 100) y += y > 50 ? 1900 : 2000;
  return new Date(Date.UTC(y, +mdy[1] - 1, +mdy[2]));
}

function formatDate(date, fmt, tz) {
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "";
  let y, m, d;
  if (tz) {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
    }).formatToParts(date);
    y = parts.find((p) => p.type === "year")?.value || "";
    m = parts.find((p) => p.type === "month")?.value || "";
    d = parts.find((p) => p.type === "day")?.value || "";
  } else {
    y = String(date.getUTCFullYear());
    m = String(date.getUTCMonth() + 1).padStart(2, "0");
    d = String(date.getUTCDate()).padStart(2, "0");
  }
  return (fmt || "yyyy-MM-dd").replace("yyyy", y).replace("MM", m).replace("dd", d);
}

function sizeBucket(w, h) {
  const s = Math.min(w, h);
  const l = Math.max(w, h);
  const near = (a, b, tol = 36) => Math.abs(a - b) < tol;
  if (near(s, 612) && near(l, 792)) return "letter";
  if (near(s, 612) && near(l, 1008, 48)) return "legal";
  if (near(s, 595) && near(l, 842)) return "a4";
  return "p" + Math.round(s / 36) + "x" + Math.round(l / 36);
}

function isStrong(file, settings) {
  return (file.fieldNames?.length || 0) >= 2 || (file.tokens?.length || 0) >= settings.textPlaceMinTokens;
}

function looksJunk(file) {
  if ((file.fieldNames?.length || 0) >= 2) return false;
  const tokens = file.tokens || [];
  // Image-only pages have no tokens yet. Do not call them covers until layout
  // shows they are actually blank.
  if (tokens.length === 0 && (file.realChars || 0) < 12) {
    return !!(file.didLayout && (file.ink ?? 1) < 0.035);
  }
  const junkLex = new Set(["fax", "cover", "sheet", "facsimile", "attached", "pages", "sent", "documents", "follow", "including"]);
  const meaningful = tokens.filter((t) => !junkLex.has(t));
  return tokens.length <= 6 && meaningful.length <= 2 && (file.realChars || 0) < 120;
}

function UnionFind() {
  const parent = new Map();
  const reasons = new Map();
  function add(id) {
    if (!parent.has(id)) {
      parent.set(id, id);
      reasons.set(id, new Set());
    }
  }
  function find(id) {
    let x = id;
    while (parent.get(x) !== x) x = parent.get(x);
    let y = id;
    while (parent.get(y) !== x) {
      const n = parent.get(y);
      parent.set(y, x);
      y = n;
    }
    return x;
  }
  function union(a, b, reason) {
    add(a);
    add(b);
    const ra = find(a);
    const rb = find(b);
    if (reason) reasons.get(ra).add(reason);
    if (ra === rb) return;
    parent.set(rb, ra);
    for (const item of reasons.get(rb)) reasons.get(ra).add(item);
    if (reason) reasons.get(ra).add(reason);
  }
  return { add, find, union, reasons: (id) => reasons.get(find(id)) || new Set() };
}

function familyKeyFor(members) {
  const df = new Map();
  for (const m of members) for (const t of new Set(m.tokens || [])) df.set(t, (df.get(t) || 0) + 1);
  const ranked = [...df.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const need = Math.max(1, Math.ceil(members.length * 0.5));
  let stable = ranked.filter(([, c]) => c >= need).map(([t]) => t);
  if (stable.length < 3) stable = ranked.slice(0, 6).map(([t]) => t);
  stable.sort();
  return "f:" + fnv(stable.join("|") || members[0].id);
}

function suggestSlug(members) {
  const blob = members.map((m) => (m.tokens || []).join(" ") + " " + (m.snippet || "")).join(" ").toLowerCase();
  if (/\bw-?9\b/.test(blob)) return "w9";
  if (/\bhipaa\b|\bprivacy\b/.test(blob)) return "hipaa";
  if (/\bintake\b/.test(blob)) return "intake";
  if (/\bregistration\b/.test(blob)) return "registration";
  if (/\bcertificate\b|\bservice\b/.test(blob)) return "certificate";
  if (/\bequipment\b|\bcheckout\b/.test(blob)) return "equipment";
  const df = new Map();
  for (const m of members) for (const t of new Set(m.tokens || [])) df.set(t, (df.get(t) || 0) + 1);
  const top = [...df.entries()].sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).map((x) => x[0]).find((t) => t.length >= 5);
  return (top || "form").slice(0, 24);
}

function versionKeyFor(file) {
  const parts = [];
  if ((file.fieldNames?.length || 0) >= 2 && file.fieldSig) parts.push("fld-" + file.fieldSig.slice(0, 12));
  const rev = versionSlug(file.revision);
  if (rev) parts.push(rev);
  parts.push("p" + (file.pageCount || 1));
  if (file.packet) parts.push("packet");
  return parts.join("~");
}

function layoutClusters(files, settings) {
  const leaders = [];
  const sorted = [...files].sort((a, b) => String(a.id).localeCompare(String(b.id)));
  for (const file of sorted) {
    let best = null;
    for (const group of leaders) {
      if (!group.leader.dHash || !file.dHash || group.leader.sizeBucket !== file.sizeBucket) continue;
      const ham = hamming(group.leader.dHash, file.dHash);
      const proj = (cosine(group.leader.projV, file.projV) + cosine(group.leader.projH, file.projH)) / 2;
      if (ham <= settings.hashMax && proj >= settings.projMin && (!best || proj > best.proj)) best = { group, proj, ham };
    }
    if (best) best.group.members.push(file);
    else leaders.push({ leader: file, members: [file] });
  }
  return leaders;
}

function clusterFiles(files, settings) {
  if (settings.layoutComplete) state.debug = [];
  const active = files.filter((f) => f.didRead && !f.quarantine);
  const ejected = [];
  const junk = [];
  const manual = [];
  const strong = [];
  const weak = [];
  for (const file of active) {
    if (file.outOfRange) continue;
    if (file.ejected) ejected.push(file);
    else if (file.forceJunk) junk.push(file);
    else if (file.manualFamilyId) manual.push(file);
    else if (file.junkLikely && !isStrong(file, settings)) junk.push(file);
    else if (isStrong(file, settings)) strong.push(file);
    else weak.push(file);
  }

  const uf = UnionFind();
  for (const file of strong) uf.add(file.id);
  const byField = new Map();
  for (const file of strong) {
    if ((file.fieldNames?.length || 0) >= 2 && file.fieldSig) {
      if (!byField.has(file.fieldSig)) byField.set(file.fieldSig, []);
      byField.get(file.fieldSig).push(file);
    }
  }
  for (const arr of byField.values()) {
    for (let i = 1; i < arr.length; i++) uf.union(arr[0].id, arr[i].id, "fields-exact");
  }
  const fieldReps = [...byField.values()].map((arr) => arr[0]);
  for (let i = 0; i < fieldReps.length; i++) {
    for (let j = i + 1; j < fieldReps.length; j++) {
      const jac = jaccardSets(fieldReps[i].fieldNames, fieldReps[j].fieldNames);
      if (jac >= settings.fieldVersionJaccard) uf.union(fieldReps[i].id, fieldReps[j].id, "fields-exact");
      else if (jac >= settings.fieldFamilyJaccard) uf.union(fieldReps[i].id, fieldReps[j].id, "fields-near");
    }
  }

  const textFiles = strong.filter((f) => (f.tokens?.length || 0) >= settings.textPlaceMinTokens);
  const bySig = new Map();
  for (const file of textFiles) {
    const sig = textSig(file.tokens);
    if (!bySig.has(sig)) bySig.set(sig, []);
    bySig.get(sig).push(file);
  }
  for (const arr of bySig.values()) {
    for (let i = 1; i < arr.length; i++) uf.union(arr[0].id, arr[i].id, "text");
  }
  const reps = [...bySig.values()].map((arr) => arr[0]);
  for (let i = 0; i < reps.length; i++) {
    for (let j = i + 1; j < reps.length; j++) {
      const A = new Set(reps[i].tokens);
      const B = new Set(reps[j].tokens);
      let inter = 0;
      for (const t of A) if (B.has(t)) inter++;
      const jac = jaccardSets(A, B);
      if (inter >= (settings.sharedTextMin || 6) && jac >= settings.textJaccard) uf.union(reps[i].id, reps[j].id, "text");
    }
  }

  const assignments = new Map();
  const comps = new Map();
  for (const file of strong) {
    const root = uf.find(file.id);
    if (!comps.has(root)) comps.set(root, []);
    comps.get(root).push(file);
  }
  const familyOf = new Map();
  for (const [root, members] of comps) familyOf.set(root, familyKeyFor(members));

  const versionGroups = new Map();
  for (const file of strong) {
    const familyKey = familyOf.get(uf.find(file.id));
    const versionKey = versionKeyFor(file);
    const reasons = new Set(uf.reasons(file.id));
    assignments.set(file.id, { familyKey, versionKey, reasons });
    const gid = familyKey + "@@" + versionKey;
    if (!versionGroups.has(gid)) versionGroups.set(gid, []);
    versionGroups.get(gid).push(file);
  }

  for (const [gid, members] of [...versionGroups.entries()]) {
    const fieldBacked = members.some((m) => (m.fieldNames?.length || 0) >= 2);
    if (fieldBacked && settings.trustFields) continue;
    const hashed = members.filter((m) => m.dHash && m.projV);
    if (hashed.length < 2) continue;
    const clusters = layoutClusters(hashed, settings);
    if (clusters.length < 2) continue;
    versionGroups.delete(gid);
    for (const cluster of clusters) {
      const suffix = "L" + fnv(cluster.leader.dHash).slice(0, 4);
      for (const member of cluster.members) {
        const assignment = assignments.get(member.id);
        assignment.versionKey = assignment.versionKey + "~" + suffix;
        assignment.reasons.add("layout");
        const ng = assignment.familyKey + "@@" + assignment.versionKey;
        if (!versionGroups.has(ng)) versionGroups.set(ng, []);
        versionGroups.get(ng).push(member);
      }
    }
    const unhashed = members.filter((m) => !m.dHash);
    if (unhashed.length) versionGroups.set(gid, unhashed);
  }

  const exemplars = [];
  for (const members of versionGroups.values()) {
    const hashed = members.find((m) => m.dHash && m.projV);
    if (!hashed) continue;
    const assignment = assignments.get(hashed.id);
    exemplars.push({ file: hashed, familyKey: assignment.familyKey, versionKey: assignment.versionKey });
  }

  for (const file of weak) {
    if (!file.dHash || !file.projV) {
      if (settings.layoutComplete) assignments.set(file.id, { familyKey: "unsorted", versionKey: "loose", reasons: new Set() });
      continue;
    }
    let best = null;
    let bestAny = null;
    for (const exemplar of exemplars) {
      if (exemplar.file.sizeBucket !== file.sizeBucket) continue;
      const ham = hamming(exemplar.file.dHash, file.dHash);
      const proj = (cosine(exemplar.file.projV, file.projV) + cosine(exemplar.file.projH, file.projH)) / 2;
      if (!bestAny || proj > bestAny.proj) bestAny = { exemplar, proj, ham };
      if (ham <= settings.hashMax && proj >= settings.projMin && (!best || proj > best.proj)) best = { exemplar, proj, ham };
    }
    if (bestAny && state.debug.length < 30) {
      state.debug.push({
        file: file.name,
        ham: Math.round(bestAny.ham * 1000) / 1000,
        proj: Math.round(bestAny.proj * 1000) / 1000,
        to: bestAny.exemplar.versionKey.slice(0, 42),
        pass: !!best,
      });
    }
    if (best) {
      assignments.set(file.id, {
        familyKey: best.exemplar.familyKey,
        versionKey: "scan~" + best.exemplar.versionKey,
        reasons: new Set(["layout"]),
      });
    } else {
      file._weakBucket = (file.sizeBucket || "?") + "|" + (file.pageCount || 1);
    }
  }

  const buckets = new Map();
  for (const file of weak) {
    if (assignments.has(file.id) || !file._weakBucket) continue;
    if (!buckets.has(file._weakBucket)) buckets.set(file._weakBucket, []);
    buckets.get(file._weakBucket).push(file);
  }
  for (const arr of buckets.values()) {
    const clusters = layoutClusters(arr, settings);
    for (const cluster of clusters) {
      const familyKey = "layout:" + fnv((cluster.leader.projV || []).map((n) => Math.round(n * 4) / 4).join(",") + "|" + cluster.leader.sizeBucket);
      const versionKey = "scan~p" + (cluster.leader.pageCount || 1);
      for (const member of cluster.members) {
        assignments.set(member.id, { familyKey, versionKey, reasons: new Set(["layout"]) });
      }
    }
  }

  for (const file of manual) {
    assignments.set(file.id, {
      familyKey: file.manualFamilyId,
      versionKey: file.manualVersion || versionKeyFor(file),
      reasons: new Set(["manual"]),
    });
  }
  for (const file of junk) assignments.set(file.id, { familyKey: "junk", versionKey: "junk", reasons: new Set(["junk"]) });
  for (const file of ejected) assignments.set(file.id, { familyKey: "unsorted", versionKey: "ejected", reasons: new Set() });

  const groupsMap = new Map();
  for (const file of active) {
    if (file.outOfRange) {
      pushGroup(groupsMap, file, { familyKey: "filtered", versionKey: "range", reasons: new Set() });
      continue;
    }
    const assignment = assignments.get(file.id);
    if (!assignment) continue;
    pushGroup(groupsMap, file, assignment);
  }
  const q = files.filter((f) => f.quarantine);
  if (q.length) {
    groupsMap.set("quarantine", {
      id: "quarantine",
      familyKey: "quarantine",
      versionKey: "bad",
      members: q,
      reasons: new Set(["bad"]),
    });
  }
  const groups = [...groupsMap.values()];
  for (const group of groups) group.versionLabel = labelVersion(group);
  return { groups, assignments };
}

function pushGroup(map, file, assignment) {
  const id = assignment.familyKey + "@@" + assignment.versionKey;
  if (!map.has(id)) {
    map.set(id, {
      id,
      familyKey: assignment.familyKey,
      versionKey: assignment.versionKey,
      members: [],
      reasons: new Set(),
    });
  }
  const group = map.get(id);
  group.members.push(file);
  for (const reason of assignment.reasons || []) group.reasons.add(reason);
}

function labelVersion(group) {
  if (group.familyKey === "junk") return "covers and blanks";
  if (group.familyKey === "unsorted") return "not this form";
  if (group.familyKey === "filtered") return "outside page filter";
  if (group.familyKey === "quarantine") return "could not open";
  const key = group.versionKey || "";
  if (key.startsWith("scan~")) {
    const rev = key.match(/rev-[a-z0-9]+(?:-[a-z0-9]+)*/);
    return rev ? "scan-" + rev[0] : "scan";
  }
  const revs = [...new Set(group.members.map((m) => m.revision).filter(Boolean))];
  let core = revs.length === 1 ? versionSlug(revs[0]) : (group.members[0]?.pageCount || 1) + "p";
  if (!core) core = "v1";
  if (key.includes("~L")) {
    const mark = key.split("~L").pop().slice(0, 4);
    core = core + " · boxes " + mark;
  }
  if (group.members.some((m) => m.packet) && !key.startsWith("scan~") && !core.startsWith("packet")) core = "packet-" + core;
  const allScans = group.members.length > 0 && group.members.every((m) => m.capture === "scan");
  if (allScans && !core.startsWith("scan")) core = "scan-" + core;
  return core;
}

function confidence(group) {
  const reasons = group.reasons || new Set();
  if (group.familyKey === "quarantine") return { level: "Low", why: "Password, corrupt, or unreadable" };
  if (group.familyKey === "junk") return { level: "Review", why: "Looks like a cover or blank" };
  if (group.familyKey === "unsorted") return { level: "Low", why: "Ejected or no match" };
  if ((group.members?.length || 0) < 2 && !reasons.has("fields-exact")) return { level: "Low", why: "No sibling yet" };
  if (reasons.has("fields-exact")) return { level: "High", why: "Identical field names" };
  if (reasons.has("text") && reasons.has("layout")) return { level: "High", why: "Text and layout agree" };
  if (reasons.has("text")) return { level: "High", why: "Header tokens overlap" };
  if (reasons.has("fields-near")) return { level: "Review", why: "Similar field names" };
  if (reasons.has("layout")) return { level: "Review", why: "Layout hash and line profile" };
  if (reasons.has("manual")) return { level: "Review", why: "Moved by you" };
  return { level: "Review", why: "Grouped" };
}

function selfCheck() {
  const errors = [];
  const eq = (cond, msg) => { if (!cond) errors.push(msg); };
  const norm = normalizeText("Form W-9 Rev. 03/2018 Last Name: Okonkwo SSN 123-45-6789 Request for Taxpayer Identification", DEFAULTS);
  eq(norm.revision === "03/2018", "revision extracted");
  eq(!norm.tokens.includes("okonkwo"), "name stripped");
  eq(norm.tokens.includes("taxpayer") && (norm.tokens.includes("w9") || norm.tokens.includes("w-9")), "form tokens kept");
  eq(!norm.tokens.join(" ").includes("6789"), "ssn stripped");
  const named = fillPattern(DEFAULTS.pattern, {
    family: "w9", version: "rev-03-2018", lastname: "Ng", first: "", date: "", original: "scan",
  }, 180);
  eq(named === "w9_rev-03-2018_Ng_scan.pdf", "pattern collapsed blanks: " + named);

  const base = {
    didRead: true, fieldNames: [], fieldSig: "", tokens: [], revision: "", pageCount: 1,
    capture: "digital", sizeBucket: "letter", dHash: null, projV: null, projH: null,
    ejected: false, packet: false, realChars: 200, junkLikely: false,
  };
  const w9tok = "request taxpayer identification certification withholding exemption entity individual business classification certificate backup".split(" ");
  const inTok = "client intake matter resident household employment referral language emergency disclosure representation residence".split(" ");
  const f = (id, extra) => ({ ...base, id, ...extra });
  const files = [
    f("a", { fieldNames: ["LastName", "FirstName", "SSN", "Address", "City"], fieldSig: "Address|City|FirstName|LastName|SSN", tokens: w9tok, revision: "03/2018" }),
    f("b", { fieldNames: ["LastName", "FirstName", "SSN", "Address", "City"], fieldSig: "Address|City|FirstName|LastName|SSN", tokens: w9tok, revision: "03/2018" }),
    f("c", { fieldNames: ["AcctNo", "Addr", "City", "FirstNm", "LastNm", "TIN"], fieldSig: "AcctNo|Addr|City|FirstNm|LastNm|TIN", tokens: w9tok.concat(["digital", "assets", "foreign"]), revision: "03/2024" }),
    f("d", { tokens: inTok, revision: "01/2021", fieldNames: ["ApplicantLast", "ApplicantFirst", "DOB"], fieldSig: "ApplicantFirst|ApplicantLast|DOB" }),
    f("e", { tokens: inTok, revision: "01/2021", fieldNames: ["ApplicantLast", "ApplicantFirst", "DOB"], fieldSig: "ApplicantFirst|ApplicantLast|DOB" }),
  ];
  const { groups } = clusterFiles(files, { ...DEFAULTS, layoutComplete: true });
  const live = groups.filter((g) => !["junk", "unsorted", "filtered", "quarantine"].includes(g.familyKey));
  const fams = new Set(live.map((g) => g.familyKey));
  eq(fams.size === 2, "w9 and intake are two families, got " + fams.size);
  const w9 = live.filter((g) => (g.members[0].tokens || []).includes("taxpayer"));
  eq(w9.length === 2, "w9 split into two versions, got " + w9.length);

  const zeros = "0".repeat(64);
  const ones = "1".repeat(64);
  const projA = [1, 0, 0, 0, 0, 0, 0, 0];
  const projB = [0, 1, 0, 0, 0, 0, 0, 0];
  const cert = "certificate service certify served document persons completed delivery indicated filed clerk tribunal".split(" ");
  const certs = [
    f("c1", { tokens: cert, revision: "02/2016", dHash: zeros, projV: projA, projH: projA }),
    f("c2", { tokens: cert, revision: "02/2016", dHash: zeros, projV: projA, projH: projA }),
    f("c3", { tokens: cert, revision: "02/2016", dHash: ones, projV: projB, projH: projB }),
    f("c4", { tokens: cert, revision: "02/2016", dHash: ones, projV: projB, projH: projB }),
  ];
  const certGroups = clusterFiles(certs, { ...DEFAULTS, layoutComplete: true }).groups.filter((g) => g.familyKey.startsWith("f:"));
  eq(new Set(certGroups.map((g) => g.familyKey)).size === 1, "same title stays one family");
  eq(certGroups.length === 2, "different boxes split versions, got " + certGroups.length);
  return errors;
}

/* ---------- PDF bytes ---------- */

function concatBytes(parts) {
  let n = 0;
  for (const p of parts) n += p.length;
  const out = new Uint8Array(n);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

function pdfDoc(objects, rootId, infoId) {
  const header = enc.encode("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");
  const chunks = [header];
  const offsets = [0];
  let pos = header.length;
  for (let i = 1; i < objects.length; i++) {
    const prefix = enc.encode(i + " 0 obj\n");
    const suffix = enc.encode("\nendobj\n");
    const body = objects[i];
    offsets[i] = pos;
    chunks.push(prefix, body, suffix);
    pos += prefix.length + body.length + suffix.length;
  }
  let xref = "xref\n0 " + objects.length + "\n0000000000 65535 f \n";
  for (let i = 1; i < objects.length; i++) xref += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  xref += "trailer\n<< /Size " + objects.length + " /Root " + rootId + " 0 R /Info " + infoId + " 0 R >>\nstartxref\n" + pos + "\n%%EOF\n";
  chunks.push(enc.encode(xref));
  return concatBytes(chunks);
}

function escPdf(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
}

function buildTextPdf(spec) {
  const W = 612, H = 792;
  const pages = spec.pages;
  let next = 4;
  const pageIds = [];
  const contentIds = [];
  const widgets = [];
  pages.forEach((page, pageIndex) => {
    pageIds.push(next++);
    contentIds.push(next++);
    for (const field of page.fields || []) widgets.push({ ...field, id: next++, pageIndex });
  });
  const infoId = next++;
  const objs = new Array(infoId + 1);
  const fieldRefs = widgets.map((w) => w.id + " 0 R").join(" ");
  const acro = widgets.length
    ? " /AcroForm << /Fields [" + fieldRefs + "] /NeedAppearances true /DA (/Helv 10 Tf 0 g) /DR << /Font << /Helv 3 0 R >> >> >>"
    : "";
  objs[1] = enc.encode("<< /Type /Catalog /Pages 2 0 R" + acro + " >>");
  objs[2] = enc.encode("<< /Type /Pages /Count " + pages.length + " /Kids [" + pageIds.map((id) => id + " 0 R").join(" ") + "] >>");
  objs[3] = enc.encode("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  pages.forEach((page, pi) => {
    const mine = widgets.filter((w) => w.pageIndex === pi);
    const annots = mine.length ? " /Annots [" + mine.map((w) => w.id + " 0 R").join(" ") + "]" : "";
    objs[pageIds[pi]] = enc.encode("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Contents " + contentIds[pi] + " 0 R /Resources << /Font << /F1 3 0 R /Helv 3 0 R >> >>" + annots + " >>");
    let stream = "BT\n";
    for (const line of page.lines || []) {
      stream += "/F1 " + (line.size || 11) + " Tf\n1 0 0 1 " + line.x + " " + line.y + " Tm\n(" + escPdf(line.text) + ") Tj\n";
    }
    stream += "ET\n";
    if (page.rects?.length) {
      stream += (page.lineWidth || 2) + " w\n";
      for (const rect of page.rects) stream += rect.x + " " + rect.y + " " + rect.w + " " + rect.h + " re S\n";
    }
    const sb = enc.encode(stream);
    objs[contentIds[pi]] = concatBytes([enc.encode("<< /Length " + sb.length + " >>\nstream\n"), sb, enc.encode("endstream")]);
  });
  for (const w of widgets) {
    const x2 = w.x + (w.w || 180);
    const y2 = w.y + (w.h || 16);
    objs[w.id] = enc.encode("<< /Type /Annot /Subtype /Widget /FT /Tx /T (" + escPdf(w.name) + ") /V (" + escPdf(w.value || "") + ") /Rect [" + w.x + " " + w.y + " " + x2 + " " + y2 + "] /P " + pageIds[w.pageIndex] + " 0 R /F 4 /DA (/Helv 10 Tf 0 g) >>");
  }
  objs[infoId] = enc.encode("<< /Producer (" + escPdf(spec.producer || "Quire") + ") /Title (" + escPdf(spec.title || "Form") + ") /Creator (" + escPdf(spec.creator || "Quire") + ") >>");
  return pdfDoc(objs, 1, infoId);
}

function buildImagePdf(jpeg, imgW, imgH, title) {
  const content = enc.encode("q\n612 0 0 792 0 0 cm\n/Im0 Do\nQ\n");
  const dict = enc.encode("<< /Type /XObject /Subtype /Image /Width " + imgW + " /Height " + imgH + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpeg.length + " >>\nstream\n");
  const objs = new Array(7);
  objs[1] = enc.encode("<< /Type /Catalog /Pages 2 0 R >>");
  objs[2] = enc.encode("<< /Type /Pages /Count 1 /Kids [3 0 R] >>");
  objs[3] = enc.encode("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>");
  objs[4] = concatBytes([enc.encode("<< /Length " + content.length + " >>\nstream\n"), content, enc.encode("endstream")]);
  objs[5] = concatBytes([dict, jpeg, enc.encode("\nendstream")]);
  objs[6] = enc.encode("<< /Producer (Quire Scan) /Title (" + escPdf(title || "scan") + ") >>");
  return pdfDoc(objs, 1, 6);
}
